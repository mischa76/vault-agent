name: Release

# A pushed tag `X.Y.Z` (no `v`) is a release. The workflow refuses a tag whose version is not
# the project's (`uv version`), runs the definition of done, builds sdist and wheel, and
# publishes the GitHub release with the matching CHANGELOG section as its notes. Nothing is
# uploaded to PyPI — distribution beyond GitHub is a separate decision (docs/log.md 2026-09-12).

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Tag must equal the project version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(uv version --short)"
          echo "tag=$TAG project=$VERSION"
          test "$TAG" = "$VERSION" || { echo "::error::tag $TAG != pyproject version $VERSION — bump with 'uv version $TAG' first"; exit 1; }
      - name: Sync deps
        run: uv sync --extra dev
      - name: Definition of done
        run: |
          uv run ruff check .
          uv run mypy
          uv run pytest -q
      - name: Build
        run: uv build
      - name: Release notes from CHANGELOG
        run: |
          python3 - "$GITHUB_REF_NAME" > notes.md <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[%s\][^\n]*\n(.*?)(?=^## \[|\Z)" % re.escape(version), text, re.S | re.M)
          if not m:
              sys.exit("CHANGELOG.md has no section for %s" % version)
          print(m.group(1).strip())
          PY
          cat notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "vault-agent $GITHUB_REF_NAME" --notes-file notes.md
          fi
