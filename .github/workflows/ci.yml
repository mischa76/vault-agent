name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Sync deps
        run: uv sync --extra dev --extra ui
      - name: Lint
        run: uv run ruff check .
      # Bare invocation ON PURPOSE (WP27 §2.1): an explicit path OVERRIDES pyproject's
      # `files = ["src/vault_agent", "eval"]`, so `mypy src` silently skipped eval/ — the
      # 2,000+ lines carrying the quality gates everything else leans on. A green CI must
      # be the same statement as a green local check, not a weaker one.
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest -q

  # The frontend's own checks (WP67 §2.6): type-check, Vitest, and a build — the proof the bundle
  # the Python app serves can be produced from this commit. Node-free Python stays the test job.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
