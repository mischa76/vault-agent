name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Sync deps
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      # Bare invocation ON PURPOSE (WP27 §2.1): an explicit path OVERRIDES pyproject's
      # `files = ["src/vault_agent", "eval"]`, so `mypy src` silently skipped eval/ — the
      # 2,000+ lines carrying the quality gates everything else leans on. A green CI must
      # be the same statement as a green local check, not a weaker one.
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest -q
