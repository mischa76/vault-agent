spec-version: 1.0.0
name: BusinessEntityContact
namespace: source
dataAssetResourceName: datastore://source/BusinessEntityContact
doc: Staging asset linking a business entity to a person who acts as a contact for
  it, qualified by a contact type. The contract enforces the presence and schema of
  the listed fields; key and not-null constraints are handled by the deterministic
  core. Ownership and agreement are to be settled at the human-in-the-loop checkpoint.
owner:
  name: 'TODO: assign'
  email: null
schema:
- name: BusinessEntityID
  description: Identifier of the business entity (e.g. store or vendor) that the contact
    is associated with; references BusinessEntity.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PersonID
  description: Identifier of the person who serves as the contact; references Person.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ContactTypeID
  description: Identifier of the type/role of the contact; references ContactType.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: rowguid
  description: Globally unique row identifier (GUID) for the source record.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the source record was last modified.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
