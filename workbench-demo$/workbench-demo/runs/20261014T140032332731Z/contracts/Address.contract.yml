spec-version: 1.0.0
name: Address
namespace: source
dataAssetResourceName: datastore://source/Address
doc: Staging contract for the Address source table, representing physical street addresses
  (e.g. for customers, employees, vendors). Enforces the declared schema and the AddressID
  business key; value-level semantics are not constrained because no requirements
  specify them.
owner:
  name: 'TODO: assign'
  email: null
schema:
- name: AddressID
  description: Unique identifier of an address row; business key of the asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: AddressLine1
  description: First line of the street address.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
