spec-version: 1.0.0
name: PersonPhone
namespace: source
dataAssetResourceName: datastore://source/PersonPhone
doc: Staging asset for person phone numbers from the source PersonPhone table. Each
  record links a person (by BusinessEntityID) to a phone number and its phone number
  type. The contract enforces the declared schema, business key uniqueness and not-null
  rules; value-level constraints are left for producer/consumer negotiation at the
  human review checkpoint.
owner:
  name: 'TODO: assign'
  email: null
schema:
- name: BusinessEntityID
  description: Identifier of the business entity (person) that the phone number belongs
    to; references the Person/BusinessEntity record.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PhoneNumber
  description: The telephone number of the person, as stored in the source system.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PhoneNumberTypeID
  description: Identifier of the phone number type (for example the kind of phone)
    describing this number; references PhoneNumberType.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the source record was last modified.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
