spec-version: 1.0.0
name: Password
namespace: source
dataAssetResourceName: datastore://source/Password
doc: Source-to-staging asset for Password, holding credential data (hash and salt)
  associated with a business entity (person). The contract enforces the declared schema,
  business key and not-null rules; value-level constraints are not specified in the
  requirements and are left for producer/consumer review. Contains sensitive credential
  fields that need access-control review.
owner:
  name: 'TODO: assign'
  email: null
schema:
- name: BusinessEntityID
  description: Identifier of the business entity (person) the password record belongs
    to. References BusinessEntity.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PasswordHash
  description: Hashed representation of the password. Sensitive credential data; should
    not be exposed to consumers without review.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PasswordSalt
  description: Salt value used when hashing the password. Sensitive credential data.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: rowguid
  description: Globally unique identifier (GUID) for the row, used for replication/row
    identification.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the record was last modified in the source system.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
