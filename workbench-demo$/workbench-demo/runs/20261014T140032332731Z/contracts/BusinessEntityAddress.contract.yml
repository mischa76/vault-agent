spec-version: 1.0.0
name: BusinessEntityAddress
namespace: source
dataAssetResourceName: datastore://source/BusinessEntityAddress
doc: Associates a business entity (e.g. person, vendor, store) with an address and
  the type of that address (e.g. billing, home). Each row links one BusinessEntityID
  to one AddressID under one AddressTypeID. The contract enforces schema conformance
  and key integrity for these identifiers; value-level constraints are not specified
  in the requirements.
owner:
  name: 'TODO: assign'
  email: null
schema:
- name: BusinessEntityID
  description: Identifier of the business entity that the address is associated with;
    references the BusinessEntity asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: AddressID
  description: Identifier of the address linked to the business entity; references
    the Address asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: AddressTypeID
  description: Identifier of the type of address (the role the address plays for the
    business entity); references the AddressType asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: rowguid
  description: Globally unique identifier (GUID) for the row, used for row identification
    such as in replication.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the row was last modified in the source.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
