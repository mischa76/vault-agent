hubs:
- business_key: BusinessEntityID
  business_key_columns: []
  description: 'Party register: the company-wide business entity (customer, vendor,
    employee, store, person). Persons share the same business entity number, so persons
    are described by satellites on this hub rather than a separate hub (one hub per
    business key). Every person is a business entity, so the hub is loaded from BusinessEntity;
    person, email, phone and credential satellites attach via BusinessEntityID from
    their own relations.'
  name: hub_business_entity
  requirement_ids:
  - REQ-001
  - REQ-002
  - REQ-003
  - REQ-004
  - REQ-005
  - REQ-009
  - REQ-010
  - REQ-064
  source_entity: BusinessEntity
  sources: []
- business_key: AddressID
  business_key_columns: []
  description: Postal address, identified by its own address number and shareable
    across parties.
  name: hub_address
  requirement_ids:
  - REQ-001-2
  - REQ-007-2
  source_entity: Address
  sources: []
- business_key: AddressTypeID
  business_key_columns: []
  description: Reference list of address types (Billing, Home, Shipping).
  name: hub_address_type
  requirement_ids:
  - REQ-014-2
  - REQ-011-2
  source_entity: AddressType
  sources: []
- business_key: ContactTypeID
  business_key_columns: []
  description: Reference list of contact types (role a person plays for an organisation).
  name: hub_contact_type
  requirement_ids:
  - REQ-035-2
  - REQ-036-2
  source_entity: ContactType
  sources: []
- business_key: PhoneNumberTypeID
  business_key_columns: []
  description: Reference list of phone number types (home, work, mobile).
  name: hub_phone_number_type
  requirement_ids:
  - REQ-042
  - REQ-046
  source_entity: PhoneNumberType
  sources: []
- business_key: CountryRegionCode
  business_key_columns: []
  description: Country or region identified by ISO code.
  name: hub_country_region
  requirement_ids:
  - REQ-020-2
  source_entity: CountryRegion
  sources: []
- business_key: StateProvinceID
  business_key_columns: []
  description: State or province identified by its own number.
  name: hub_state_province
  requirement_ids:
  - REQ-021-2
  source_entity: StateProvince
  sources: []
