source_schemas:
- table: Department
  schema: HumanResources
  columns:
  - name: DepartmentID
    type: smallint
    comment: Primary key for Department records.
  - name: Name
    type: Name
    comment: Name of the department.
  - name: GroupName
    type: Name
    comment: Name of the group to which the department belongs.
  - name: ModifiedDate
    type: datetime
    comment: Date and time the record was last updated.
- table: Employee
  schema: HumanResources
  columns:
  - name: BusinessEntityID
    type: int
    comment: Primary key for Employee records.  Foreign key to BusinessEntity.BusinessEntityID.
  - name: NationalIDNumber
    type: nvarchar(15)
    comment: Unique national identification number such as a social security number.
  - name: LoginID
    type: nvarchar(256)
    comment: Network login.
  - name: OrganizationNode
    type: hierarchyid
    comment: Where the employee is located in corporate hierarchy.
  - name: OrganizationLevel
    type: AS
    comment: The depth of the employee in the corporate hierarchy.
  - name: JobTitle
    type: nvarchar(50)
    comment: Work title such as Buyer or Sales Representative.
  - name: BirthDate
    type: date
    comment: Date of birth.
  - name: MaritalStatus
    type: nchar(1)
    comment: M = Married, S = Single
  - name: Gender
    type: nchar(1)
    comment: M = Male, F = Female
  - name: HireDate
    type: date
    comment: Employee hired on this date.
  - name: SalariedFlag
    type: Flag
    comment: Job classification. 0 = Hourly, not exempt from collective bargaining.
      1 = Salaried, exempt from collective bargaining.
  - name: VacationHours
    type: smallint
    comment: Number of available vacation hours.
  - name: SickLeaveHours
    type: smallint
    comment: Number of available sick leave hours.
  - name: CurrentFlag
    type: Flag
    comment: 0 = Inactive, 1 = Active
  - name: rowguid
    type: uniqueidentifier
    comment: ROWGUIDCOL number uniquely identifying the record. Used to support a
      merge replication sample.
  - name: ModifiedDate
    type: datetime
    comment: Date and time the record was last updated.
- table: EmployeeDepartmentHistory
  schema: HumanResources
  columns:
  - name: BusinessEntityID
    type: int
    comment: Employee identification number. Foreign key to Employee.BusinessEntityID.
  - name: DepartmentID
    type: smallint
    comment: Department in which the employee worked including currently. Foreign
      key to Department.DepartmentID.
  - name: ShiftID
    type: tinyint
    comment: Identifies which 8-hour shift the employee works. Foreign key to Shift.Shift.ID.
  - name: StartDate
    type: date
    comment: Date the employee started work in the department.
  - name: EndDate
    type: date
    comment: Date the employee left the department. NULL = Current department.
  - name: ModifiedDate
    type: datetime
    comment: Date and time the record was last updated.
- table: EmployeePayHistory
  schema: HumanResources
  columns:
  - name: BusinessEntityID
    type: int
    comment: Employee identification number. Foreign key to Employee.BusinessEntityID.
  - name: RateChangeDate
    type: datetime
    comment: Date the change in pay is effective
  - name: Rate
    type: money
    comment: Salary hourly rate.
  - name: PayFrequency
    type: tinyint
    comment: 1 = Salary received monthly, 2 = Salary received biweekly
  - name: ModifiedDate
    type: datetime
    comment: Date and time the record was last updated.
- table: JobCandidate
  schema: HumanResources
  columns:
  - name: JobCandidateID
    type: int
    comment: Primary key for JobCandidate records.
  - name: BusinessEntityID
    type: int
    comment: Employee identification number if applicant was hired. Foreign key to
      Employee.BusinessEntityID.
  - name: Resume
    type: XML(HumanResources.HRResumeSchemaCollection)
    comment: Résumé in XML format.
  - name: ModifiedDate
    type: datetime
    comment: Date and time the record was last updated.
- table: Shift
  schema: HumanResources
  columns:
  - name: ShiftID
    type: tinyint
    comment: Primary key for Shift records.
  - name: Name
    type: Name
    comment: Shift description.
  - name: StartTime
    type: time
    comment: Shift start time.
  - name: EndTime
    type: time
    comment: Shift end time.
  - name: ModifiedDate
    type: datetime
    comment: Date and time the record was last updated.
