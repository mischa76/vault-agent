# Profiling evidence for the messy_insurance mapping spike (D1).
#
# ADR-0008 #4: profiling is a PRE-STEP artifact, not a runtime capability — produced ahead
# of time (sanitised extract / metadata export), never by the agent logging into a source.
# This file models exactly that hand-off: one block per source table, per-column statistics
# the mapping may use as evidence.
#
# Hand-authored for the spike with PLAUSIBLE values (no real data). The §4 traps are
# deliberately reflected in the numbers, because the whole point of ADR-0008's
# "statistics establish structure, not intent" is that profiling ALONE is not enough:
#   * PARTN_GUID profiles as a FLAWLESS key (uniqueness 1.0, 0 nulls) but is NOT the
#     business key — the statistics trap.
#   * PARTN_NR, the real business key, carries a realistic minor wart (0.2% nulls from a
#     legacy migration) — so a "pick the cleanest column" heuristic would wrongly prefer
#     PARTN_GUID.
#   * KD_NR (the false-friend branch code) profiles as low-cardinality — here statistics
#     DO save you, if you look.
#   * ExternalCustomerNo is only ~70% populated — the synonym candidate is visibly partial.
#
# example_values are sanitised/synthetic. uniqueness_ratio = distinct_count / non_null_count.
tables:
  - table: VICTOR_PARTNER
    row_count: 2000000
    columns:
      - name: PARTN_NR
        uniqueness_ratio: 0.9998
        null_ratio: 0.002
        distinct_count: 1992016
        example_values: ["P000012345", "P0000999812", "P0004410077"]
      - name: PARTN_GUID
        uniqueness_ratio: 1.0
