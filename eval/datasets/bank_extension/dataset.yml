# Golden case: brownfield extension of the bank vault (WP23 acceptance #2, charter §6).
#
# The one case in the suite that runs the pipeline in EXTENSION mode. It answers the question
# the whole brownfield track exists for: given a vault that already holds history and a new
# source system, does the agent ADD to it without disturbing what is there?
#
# `existing` is the logical model of the previously generated bank vault (identical to
# demo/bank_postgres' fixed model — the one model in this repo verified on a real warehouse).
# The golden below is the expected MERGED model: the existing five constructs, unchanged,
# plus what the CRM increment introduces.
#
# Deliberately conservative about the delta, in the bank case's tradition: the requirements
# also describe a responsible marketing manager (REQ-105, a hub_employee candidate) and
# campaign response timestamps (an effectivity- or transactional-link candidate). Both are
# reasonable models and neither is golden — a run that produces them loses a little
# precision rather than being required to guess the same way.
name: bank_extension
input_document: ../../../examples/inputs/bank_crm_extension_requirements.md
source_schema: ../../../examples/inputs/bank_crm_source_schema.yml
existing: existing_vault.yml
golden:
  hubs:
    # Unchanged from the existing vault — hub_customer now ALSO fed by the CRM, which is a
    # source-feed extension, not a new hub. A run that invents a second customer hub fails
    # the preservation scorer's spirit and shows up as a precision loss here.
    - {name: hub_customer, business_key: national customer ID}
    - {name: hub_account, business_key: account number}
    # New: the campaign the CRM introduces.
    - {name: hub_campaign, business_key: campaign code}
  links:
    - {name: link_account_customer, connected_hubs: [hub_account, hub_customer],
       driving_key: [hub_account]}
    # New: campaign targeting is a many-to-many between customer and campaign.
    - {name: link_campaign_customer, connected_hubs: [hub_campaign, hub_customer]}
  satellites:
    - {name: sat_customer_details, parent: hub_customer, sat_type: standard}
    - {name: sat_account_details, parent: hub_account, sat_type: standard}
    - {name: sat_account_customer_eff, parent: link_account_customer, sat_type: effectivity}
    # New: REQ-107 requires the CRM's customer attributes to be historised SEPARATELY from
    # the core system's, so this must be its own satellite on the existing hub — never an
    # extension of sat_customer_details (which would be a backfill migration).
    - {name: sat_customer_marketing, parent: hub_customer, sat_type: standard}
    - {name: sat_campaign_details, parent: hub_campaign, sat_type: standard}
expectations:
  # KNOWN LIMITATION, measured over 6 live runs on 2026-07-29 and deliberately NOT hidden by
  # flipping this to false: validation currently FAILS on this case, so validation_gate
  # reports 0.0. It is reported, not gated — the gates below are what brownfield mode
  # promises. Two stable causes, both worth fixing outside this case:
  #
  # 1. E_SAT_SOURCE_TABLE_ON_MULTI_SOURCE_HUB fires on the *natural* brownfield shape. The
  #    modeler correctly reads REQ-107 ("historise CRM attributes separately") and emits a
  #    satellite fed by crm_contact on the now-multi-source hub_customer. WP24 rejected that
  #    combination because one relation cannot feed two independent feeds — true when the
  #    satellite describes ALL of them, but here it describes ONE, which is legitimate.
  #    A steering rule was added and did NOT prevent it (0/3 runs), so this needs the
  #    modelling decision + ADR that WP24 §5 already anticipated, not more prompt text.
  # 2. E_HUB_HK_COLLISION on hub_campaign/hub_employee: the modeler gives both source_entity
  #    'crm_campaign' (the employee number does come from that table). A genuine modelling
  #    smell the gate correctly catches; hub_employee is not golden here.
  validation_passed: true
  # Extension runs are noisier by construction: every legitimate addition raises one
  # advisory W_EXISTING_EXTENDED, which is the inventory the review queue wants. Measured:
  # 9 warnings (8x W_EXISTING_EXTENDED + 1x W_HUB_NO_SAT).
  max_validation_warnings: 15
  min_scores:
    # The promise brownfield mode makes. Anything below 1.0 means the run disturbed a vault
    # that holds live history — a defect, not a quality signal, so the gate is exact.
    existing_construct_preservation: 1.0
    # The delta itself is LLM work and is gated like the other golden cases: a conservative
    # floor, not a target (the golden deliberately omits two defensible constructs).
    construct_f1: 0.5
