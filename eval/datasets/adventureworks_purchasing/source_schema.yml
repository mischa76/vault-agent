source_schemas:
- table: ProductVendor
  schema: Purchasing
  columns:
  - name: ProductID
    type: int
    comment: Primary key. Foreign key to Product.ProductID.
  - name: BusinessEntityID
    type: int
    comment: Primary key. Foreign key to Vendor.BusinessEntityID.
  - name: AverageLeadTime
    type: int
    comment: The average span of time (in days) between placing an order with the
      vendor and receiving the purchased product.
  - name: StandardPrice
    type: money
    comment: The vendor's usual selling price.
  - name: LastReceiptCost
    type: money
    comment: The selling price when last purchased.
  - name: LastReceiptDate
    type: datetime
    comment: Date the product was last received by the vendor.
  - name: MinOrderQty
    type: int
    comment: The maximum quantity that should be ordered.
  - name: MaxOrderQty
    type: int
    comment: The minimum quantity that should be ordered.
  - name: OnOrderQty
    type: int
    comment: The quantity currently on order.
  - name: UnitMeasureCode
    type: nchar(3)
    comment: The product's unit of measure.
  - name: ModifiedDate
    type: datetime
    comment: Date and time the record was last updated.
- table: PurchaseOrderDetail
  schema: Purchasing
  columns:
  - name: PurchaseOrderID
    type: int
    comment: Primary key. Foreign key to PurchaseOrderHeader.PurchaseOrderID.
  - name: PurchaseOrderDetailID
    type: int
    comment: Primary key. One line number per purchased product.
  - name: DueDate
    type: datetime
    comment: Date the product is expected to be received.
  - name: OrderQty
    type: smallint
    comment: Quantity ordered.
  - name: ProductID
    type: int
    comment: Product identification number. Foreign key to Product.ProductID.
  - name: UnitPrice
    type: money
    comment: Vendor's selling price of a single product.
  - name: LineTotal
    type: AS
    comment: Per product subtotal. Computed as OrderQty * UnitPrice.
  - name: ReceivedQty
    type: decimal(8, 2)
    comment: Quantity actually received from the vendor.
  - name: RejectedQty
    type: decimal(8, 2)
    comment: Quantity rejected during inspection.
  - name: StockedQty
    type: AS
    comment: Quantity accepted into inventory. Computed as ReceivedQty - RejectedQty.
  - name: ModifiedDate
    type: datetime
    comment: Date and time the record was last updated.
- table: PurchaseOrderHeader
  schema: Purchasing
  columns:
  - name: PurchaseOrderID
    type: int
    comment: Primary key.
  - name: RevisionNumber
    type: tinyint
    comment: Incremental number to track changes to the purchase order over time.
  - name: Status
    type: tinyint
    comment: Order current status. 1 = Pending; 2 = Approved; 3 = Rejected; 4 = Complete
  - name: EmployeeID
    type: int
    comment: Employee who created the purchase order. Foreign key to Employee.BusinessEntityID.
  - name: VendorID
    type: int
    comment: Vendor with whom the purchase order is placed. Foreign key to Vendor.BusinessEntityID.
  - name: ShipMethodID
    type: int
    comment: Shipping method. Foreign key to ShipMethod.ShipMethodID.
  - name: OrderDate
    type: datetime
    comment: Purchase order creation date.
  - name: ShipDate
    type: datetime
    comment: Estimated shipment date from the vendor.
  - name: SubTotal
    type: money
    comment: Purchase order subtotal. Computed as SUM(PurchaseOrderDetail.LineTotal)for
      the appropriate PurchaseOrderID.
  - name: TaxAmt
    type: money
    comment: Tax amount.
  - name: Freight
    type: money
    comment: Shipping cost.
  - name: TotalDue
    type: AS
    comment: Total due to vendor. Computed as Subtotal + TaxAmt + Freight.
  - name: ModifiedDate
    type: datetime
    comment: Date and time the record was last updated.
- table: ShipMethod
  schema: Purchasing
  columns:
  - name: ShipMethodID
    type: int
    comment: Primary key for ShipMethod records.
  - name: Name
    type: Name
    comment: Shipping company name.
  - name: ShipBase
    type: money
    comment: Minimum shipping charge.
  - name: ShipRate
    type: money
    comment: Shipping charge per pound.
  - name: rowguid
    type: uniqueidentifier
    comment: ROWGUIDCOL number uniquely identifying the record. Used to support a
      merge replication sample.
  - name: ModifiedDate
    type: datetime
    comment: Date and time the record was last updated.
- table: Vendor
  schema: Purchasing
  columns:
  - name: BusinessEntityID
    type: int
    comment: Primary key for Vendor records.  Foreign key to BusinessEntity.BusinessEntityID
  - name: AccountNumber
    type: AccountNumber
    comment: Vendor account (identification) number.
  - name: Name
    type: Name
    comment: Company name.
  - name: CreditRating
    type: tinyint
    comment: 1 = Superior, 2 = Excellent, 3 = Above average, 4 = Average, 5 = Below
      average
  - name: PreferredVendorStatus
    type: Flag
    comment: 0 = Do not use if another vendor is available. 1 = Preferred over other
      vendors supplying the same product.
  - name: ActiveFlag
    type: Flag
    comment: 0 = Vendor no longer used. 1 = Vendor is actively used.
  - name: PurchasingWebServiceURL
    type: nvarchar(1024)
  - name: ModifiedDate
    type: datetime
