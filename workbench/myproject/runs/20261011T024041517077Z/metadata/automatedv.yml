hubs:
  hub_account:
    source_model: stg_account
    src_ldts: LOAD_DATETIME
    src_nk: ACCOUNT_NUMBER
    src_pk: ACCOUNT_HK
    src_source: RECORD_SOURCE
  hub_customer:
    source_model: stg_customer
    src_ldts: LOAD_DATETIME
    src_nk: NATIONAL_CUSTOMER_ID
    src_pk: CUSTOMER_HK
    src_source: RECORD_SOURCE
links:
  link_account_customer:
    source_model: stg_account_customer
    src_fk:
    - ACCOUNT_HK
    - CUSTOMER_HK
    src_ldts: LOAD_DATETIME
    src_pk: LINK_ACCOUNT_CUSTOMER_HK
    src_source: RECORD_SOURCE
satellites:
  sat_account_balance:
    source_model: stg_account_balance
    src_hashdiff: ACCOUNT_BALANCE_HASHDIFF
    src_ldts: LOAD_DATETIME
    src_payload:
    - BALANCE
    src_pk: ACCOUNT_HK
    src_source: RECORD_SOURCE
  sat_account_customer_effectivity:
    source_model: stg_account_customer
    src_dfk: ACCOUNT_HK
    src_eff: APPLIED_DTS
    src_end_date: EFFECTIVE_TO
    src_ldts: LOAD_DATETIME
    src_pk: LINK_ACCOUNT_CUSTOMER_HK
    src_sfk:
    - CUSTOMER_HK
    src_source: RECORD_SOURCE
    src_start_date: EFFECTIVE_FROM
  sat_account_status:
    source_model: stg_account_status
    src_hashdiff: ACCOUNT_STATUS_HASHDIFF
    src_ldts: LOAD_DATETIME
    src_payload:
    - STATUS
    src_pk: ACCOUNT_HK
    src_source: RECORD_SOURCE
  sat_customer_pii:
    source_model: stg_customer_pii
    src_hashdiff: CUSTOMER_PII_HASHDIFF
    src_ldts: LOAD_DATETIME
    src_payload:
    - CUSTOMER_NAME
    - DATE_OF_BIRTH
    src_pk: CUSTOMER_HK
    src_source: RECORD_SOURCE
  sat_customer_reference:
    source_model: stg_customer_reference
    src_hashdiff: CUSTOMER_REFERENCE_HASHDIFF
    src_ldts: LOAD_DATETIME
    src_payload:
    - BANK_CUSTOMER_REFERENCE
    src_pk: CUSTOMER_HK
    src_source: RECORD_SOURCE
staging:
