# dbt connection profile for the bank demo on Databricks (WP72).
#
# Nothing secret lives here: host, HTTP path and token come from the environment — put them
# in the repo's `.env` (gitignored) and run dbt through `uv run --env-file ../../.env`, or
# export them. Catalog and schema default to the Free Edition's `workspace.default`.
#
#   DATABRICKS_HOST=dbc-xxxxxxxx-xxxx.cloud.databricks.com
#   DATABRICKS_HTTP_PATH=/sql/1.0/warehouses/xxxxxxxxxxxxxxxx
#   DATABRICKS_TOKEN=<the personal access token>
#
# dbt finds this file because the runbook runs dbt from this directory with DBT_PROFILES_DIR=.
bank_databricks:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'workspace') }}"
      schema: "{{ env_var('DATABRICKS_SCHEMA', 'default') }}"
      threads: 4
