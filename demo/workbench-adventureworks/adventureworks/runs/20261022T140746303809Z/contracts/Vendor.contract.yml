spec-version: 1.0.0
name: Vendor
namespace: source
dataAssetResourceName: datastore://source/Vendor
doc: Vendor represents a supplier from which the organization purchases goods, identified
  by BusinessEntityID, as landed from the source into staging. The contract enforces
  the declared schema and key/not-null constraints; value-level semantics are minimal
  pending producer/consumer review.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: BusinessEntityID
  description: Unique identifier of the vendor business entity; business key of the
    Vendor asset.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: AccountNumber
  description: Vendor account number used to identify the vendor in purchasing.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Name
  description: Name of the vendor company.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: CreditRating
  description: Credit rating assigned to the vendor. Allowed values and scale are
    not specified in the requirements.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PreferredVendorStatus
  description: Indicates whether the vendor is a preferred vendor. Value representation
    is not specified in the requirements.
  examples: []
  constraints:
    primaryKey: false
    data_type: boolean
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ActiveFlag
  description: Indicates whether the vendor is currently active. Value representation
    is not specified in the requirements.
  examples: []
  constraints:
    primaryKey: false
    data_type: boolean
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PurchasingWebServiceURL
  description: URL of the vendor's purchasing web service, if any.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the vendor record was last modified in the source.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
