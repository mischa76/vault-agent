spec-version: 1.0.0
name: PurchaseOrderDetail
namespace: source
dataAssetResourceName: datastore://source/PurchaseOrderDetail
doc: Line-item detail of a purchase order, one row per product line on a purchase
  order, staged from the source PurchaseOrderDetail table. The contract enforces the
  declared schema, business-key uniqueness and not-null rules; value-level semantics
  are advisory pending producer/consumer review.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: PurchaseOrderID
  description: Identifier of the parent purchase order (references PurchaseOrderHeader).
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
