# Entity resolution against the existing vault — review & ratify (WP29).
# resolution: <existing construct name> | NEW | same_as_candidate | unresolved
# Then:  vault-agent resume --resolutions <this file>
# Or:    vault-agent resume --resolve "concept=hub_name"
# A merge is applied ONLY after you ratify it — an unratified proposal never
# steers the modeler, because a wrong merge writes foreign keys into live history.
resolutions:
- concept: vendor::AccountNumber (vendor account number)
  resolution: unresolved
  category: comment_grounded
  evidence:
  - Vendor.AccountNumber (nvarchar(15)) is a vendor identification number, a different
    key format from the integer BusinessEntityID that hub_business_entity uses.
  - The same Vendor table carries Vendor.BusinessEntityID, which is a foreign key
    to BusinessEntity.BusinessEntityID. So the account number describes the same real-world
    entity under a different key.
  - It cannot hash into hub_business_entity, so it is flagged for a human rather than
    merged.
  - human ratification
  confidence: 0.5
  ratification_status: overridden
- concept: vendor::BusinessEntityID (internal business entity identifier)
  resolution: hub_business_entity
  category: comment_grounded
  evidence:
  - 'Vendor.BusinessEntityID comment: ''Foreign key to BusinessEntity.BusinessEntityID''.'
  - hub_business_entity has business key BusinessEntityID with source entity BusinessEntity,
    so the key and its format are identical.
  confidence: 0.95
  ratification_status: accepted
