spec-version: 1.0.0
name: Address
namespace: source
dataAssetResourceName: datastore://source/Address
doc: Source-to-staging asset representing physical street addresses (e.g. for customers,
  employees, vendors). The contract enforces the declared schema and the business
  key AddressID; value-level semantics are not yet grounded in stated requirements
  and are left for human review.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
