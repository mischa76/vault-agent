spec-version: 1.0.0
name: EmailAddress
namespace: source
dataAssetResourceName: datastore://source/EmailAddress
doc: Email addresses associated with a business entity (person) in the source-to-staging
  load of the EmailAddress source table. The contract enforces the declared schema
  and business-key identity; value-level constraints are left for producer/consumer
  review.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: BusinessEntityID
  description: Identifier of the business entity (person) that owns this email address;
    references BusinessEntity/Person.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: EmailAddressID
  description: Identifier of the email address row, distinguishing multiple email
    addresses for the same business entity.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: EmailAddress
  description: The email address text for the business entity.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
