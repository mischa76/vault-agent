spec-version: 1.0.0
name: PersonPhone
namespace: source
dataAssetResourceName: datastore://source/PersonPhone
doc: Staging asset for person phone numbers from the source PersonPhone table. Each
  record links a person (by BusinessEntityID) to a phone number and its phone number
  type. The contract enforces the declared schema, business-key uniqueness and not-null
  rules (handled by the deterministic core); no value-level thresholds are stated
  in the requirements, so ownership and further semantics are left to human review.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: BusinessEntityID
  description: Identifier of the person (business entity) that the phone number belongs
    to; references the Person/BusinessEntity record.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PhoneNumber
  description: The telephone number of the person, as recorded in the source system.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PhoneNumberTypeID
  description: Identifier of the phone number type (e.g. as defined in PhoneNumberType)
    classifying this phone number.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time when the source record was last modified.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
