spec-version: 1.0.0
name: Password
namespace: source
dataAssetResourceName: datastore://source/Password
doc: 'Source-to-staging asset for Password: stores credential material (hash and salt)
  associated with a business entity (person). The contract enforces the declared schema
  and business-key integrity; ownership and agreement are to be confirmed at the human-in-the-loop
  checkpoint. Contains sensitive credential fields that warrant review for handling/masking.'
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: BusinessEntityID
  description: Identifier of the business entity (person) to which this password record
    belongs; business key referencing BusinessEntity.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PasswordHash
  description: Hashed representation of the password. Sensitive credential material.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PasswordSalt
  description: Salt value used when hashing the password. Sensitive credential material.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: rowguid
  description: Row-level globally unique identifier (GUID) for the record.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the record was last modified.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
