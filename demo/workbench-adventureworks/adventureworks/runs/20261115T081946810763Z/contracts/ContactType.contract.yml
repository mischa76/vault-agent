name: ContactType
namespace: source
dataAssetResourceName: datastore://source/ContactType
doc: Reference data describing the types of contact (e.g. roles) that a business entity
  contact can have. One record per contact type, identified by ContactTypeID. The
  contract enforces the declared schema, primary key and not-null rules; value-level
  constraints are left for producer/consumer negotiation.
owner:
  name: John Doe
  email: john.doe@acme.com
