spec-version: 1.0.0
name: BusinessEntityContact
namespace: source
dataAssetResourceName: datastore://source/BusinessEntityContact
doc: Source-to-staging asset linking a business entity to a contact person and the
  type of contact relationship. The contract enforces the declared schema and business-key
  integrity; value-level checks are limited to what is stated in requirements.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: BusinessEntityID
  description: Identifier of the business entity that the contact relationship belongs
    to; references BusinessEntity.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PersonID
  description: Identifier of the person who acts as the contact for the business entity;
