spec-version: 1.0.0
name: Person
namespace: source
dataAssetResourceName: datastore://source/Person
doc: 'Staging contract for the Person source table: one record per person (individual)
  associated with a business entity, including name parts, person type, and contact-preference
  attributes. Schema, primary-key and not-null breaches are enforced as hard failures
  by the core; no value-level constraints are mandated by the requirements, so none
  are declared here. Ownership and agreement are pending human review.'
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: BusinessEntityID
  description: Identifier of the business entity this person record belongs to; business
    key of the Person asset and a reference to BusinessEntity.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PersonType
  description: Code classifying the type of person (for example, employee, customer,
    or contact). Allowed values are not specified in the requirements.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: NameStyle
  description: Flag indicating how the name is written/ordered (e.g., standard vs.
    eastern order).
  examples: []
  constraints:
    primaryKey: false
    data_type: boolean
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Title
