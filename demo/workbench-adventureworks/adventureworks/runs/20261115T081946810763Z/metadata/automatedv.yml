staging:
  stg_address:
    expected_source_columns:
    - ADDRESSID
    - LOAD_DATETIME
    - RECORD_SOURCE
    hashed_columns:
      ADDRESS_HK: ADDRESSID
    source_binding: declared
    source_model:
      raw: Address
  stg_address_details:
    derived_columns:
      ADDRESSLINE1__CS: ENCODE(CONVERT_TO(NULLIF(TRIM(CAST(ADDRESSLINE1 AS text)),
        ''), 'UTF8'), 'hex')
      ADDRESSLINE2__CS: ENCODE(CONVERT_TO(NULLIF(TRIM(CAST(ADDRESSLINE2 AS text)),
        ''), 'UTF8'), 'hex')
      CITY__CS: ENCODE(CONVERT_TO(NULLIF(TRIM(CAST(CITY AS text)), ''), 'UTF8'), 'hex')
      MODIFIEDDATE__CS: ENCODE(CONVERT_TO(NULLIF(TRIM(CAST(MODIFIEDDATE AS text)),
        ''), 'UTF8'), 'hex')
      POSTALCODE__CS: ENCODE(CONVERT_TO(NULLIF(TRIM(CAST(POSTALCODE AS text)), ''),
        'UTF8'), 'hex')
    expected_source_columns:
    - ADDRESSID
    - ADDRESSLINE1
    - ADDRESSLINE2
    - CITY
    - POSTALCODE
    - MODIFIEDDATE
    - LOAD_DATETIME
    - RECORD_SOURCE
    expression_reads:
      ADDRESSLINE1__CS:
      - ADDRESSLINE1
      ADDRESSLINE2__CS:
      - ADDRESSLINE2
      CITY__CS:
      - CITY
      MODIFIEDDATE__CS:
      - MODIFIEDDATE
      POSTALCODE__CS:
      - POSTALCODE
    hashed_columns:
      ADDRESS_DETAILS_HASHDIFF:
        columns:
        - ADDRESSLINE1__CS
        - ADDRESSLINE2__CS
        - CITY__CS
        - POSTALCODE__CS
        - MODIFIEDDATE__CS
        is_hashdiff: true
      ADDRESS_HK: ADDRESSID
    source_binding: declared
    source_model:
      raw: Address
  stg_address_location:
    derived_columns:
      SPATIALLOCATION__CS: ENCODE(CONVERT_TO(NULLIF(TRIM(CAST(SPATIALLOCATION AS text)),
        ''), 'UTF8'), 'hex')
    expected_source_columns:
    - ADDRESSID
    - SPATIALLOCATION
    - LOAD_DATETIME
    - RECORD_SOURCE
    expression_reads:
      SPATIALLOCATION__CS:
      - SPATIALLOCATION
    hashed_columns:
      ADDRESS_HK: ADDRESSID
      ADDRESS_LOCATION_HASHDIFF:
        columns:
        - SPATIALLOCATION__CS
        is_hashdiff: true
    source_binding: declared
    source_model:
      raw: Address
  stg_address_state_province:
    expected_source_columns:
    - ADDRESSID
    - STATEPROVINCEID
    - LOAD_DATETIME
    - RECORD_SOURCE
    hashed_columns:
      ADDRESS_HK: ADDRESSID
      LINK_ADDRESS_STATE_PROVINCE_HK:
