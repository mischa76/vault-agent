# Generated by vault-agent — dbt project scaffolding for the generated Data Vault.
# Define a matching connection profile named 'vault_project' in profiles.yml
# (see README.md); then: dbt deps && dbt build.
name: 'vault_project'
version: '1.0.0'
config-version: 2

profile: 'vault_project'

model-paths: ["models"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  vault_project:
    staging:
      # Thin view layer (hash keys / hashdiffs); no need to persist it.
      +materialized: view
    raw_vault:
      # The generated models already carry config(materialized='incremental');
      # this is a belt-and-braces default.
      +materialized: incremental

seeds:
  vault_project:
    # Keep seed column headers UNQUOTED so UPPER_SNAKE identifiers fold consistently
    # with the (also unquoted) identifiers AutomateDV emits (verified on Postgres —
    # see demo/bank_postgres in the vault-agent repo).
    +quote_columns: false
    # Column types pinned from the drafted data contracts (never inferred);
    # columns with an undetermined contract type are omitted and left to dbt's
    # seed inference, so a gap stays visible instead of being guessed at.
    Product:
      +column_types:
        PRODUCTID: bigint
        NAME: varchar
        PRODUCTNUMBER: varchar
        MAKEFLAG: boolean
        FINISHEDGOODSFLAG: boolean
        COLOR: varchar
        SAFETYSTOCKLEVEL: bigint
        REORDERPOINT: bigint
        STANDARDCOST: numeric
        LISTPRICE: numeric
        SIZE: varchar
        SIZEUNITMEASURECODE: varchar
        WEIGHTUNITMEASURECODE: varchar
        WEIGHT: numeric
        DAYSTOMANUFACTURE: bigint
        PRODUCTLINE: varchar
        CLASS: varchar
        STYLE: varchar
        PRODUCTSUBCATEGORYID: bigint
        PRODUCTMODELID: bigint
        SELLSTARTDATE: varchar
        SELLENDDATE: varchar
        DISCONTINUEDDATE: varchar
        ROWGUID: varchar
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
    ProductCategory:
      +column_types:
        PRODUCTCATEGORYID: bigint
        NAME: varchar
        ROWGUID: varchar
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
