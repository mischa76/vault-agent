spec-version: 1.0.0
name: ProductListPriceHistory
namespace: source
dataAssetResourceName: datastore://source/ProductListPriceHistory
doc: History of list price changes per product, with each row giving the price and
  the date range during which it applied. The contract enforces the declared schema
  and business keys; no value-level thresholds are stated in the requirements.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: ProductID
  description: Identifier of the product whose list price is recorded; references
    the Product asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: StartDate
  description: Date on which this list price became effective for the product.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: EndDate
  description: Date on which this list price stopped being effective; empty when the
    price is still current.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ListPrice
  description: Selling price of the product during the period from StartDate to EndDate.
  examples: []
  constraints:
    primaryKey: false
    data_type: number
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the record was last modified in the source.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
