spec-version: 1.0.0
name: Location
namespace: source
dataAssetResourceName: datastore://source/Location
doc: 'Staging contract for the Location asset: a manufacturing/inventory location,
  with its cost rate and availability. Enforces the declared schema and business key
  (LocationID); ownership and agreement are to be confirmed at the human-in-the-loop
  checkpoint.'
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: LocationID
  description: Identifier of the location; business key of the asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Name
  description: Name of the location.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: CostRate
  description: Standard hourly cost rate associated with the location.
  examples: []
  constraints:
    primaryKey: false
    data_type: number
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Availability
  description: Availability of the location (e.g. work hours available); exact unit
    not specified in the requirements.
  examples: []
  constraints:
    primaryKey: false
    data_type: number
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the record was last modified in the source.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
