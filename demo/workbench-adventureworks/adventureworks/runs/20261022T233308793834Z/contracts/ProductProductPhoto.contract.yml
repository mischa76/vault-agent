spec-version: 1.0.0
name: ProductProductPhoto
namespace: source
dataAssetResourceName: datastore://source/ProductProductPhoto
doc: Associative asset linking products to product photos, indicating which photo
  is the primary one for a product. The contract enforces the declared schema and
  business-key integrity (ProductID, ProductPhotoID); ownership and agreement are
  to be confirmed at the human-in-the-loop checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: ProductID
  description: Identifier of the product the photo is associated with; references
    the Product asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ProductPhotoID
  description: Identifier of the product photo; references the ProductPhoto asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Primary
  description: Flag indicating whether this photo is the primary photo for the product.
  examples: []
  constraints:
    primaryKey: false
    data_type: boolean
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the record was last modified in the source.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
