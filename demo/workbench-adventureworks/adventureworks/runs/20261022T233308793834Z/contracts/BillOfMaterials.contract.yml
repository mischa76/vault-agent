  description: Unique identifier of the bill of materials record.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ProductAssemblyID
  description: Identifier of the parent product (assembly) that the component is part
