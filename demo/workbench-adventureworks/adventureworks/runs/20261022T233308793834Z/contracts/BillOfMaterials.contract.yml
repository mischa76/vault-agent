spec-version: 1.0.0
name: BillOfMaterials
namespace: source
dataAssetResourceName: datastore://source/BillOfMaterials
doc: Bill of materials records describing which component products make up a product
  assembly, including validity period, unit of measure, BOM level and per-assembly
  quantity. Contract enforces the declared schema and business-key constraints; value-level
  semantics are pending human review.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
