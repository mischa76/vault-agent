doc: Staging contract for the ProductModel source table, representing product model
  definitions (name, catalog description, manufacturing instructions) that products
  reference. Schema and key breaches are enforced as hard by the deterministic core;
  ownership and agreement are left to the human-in-the-loop checkpoint.
