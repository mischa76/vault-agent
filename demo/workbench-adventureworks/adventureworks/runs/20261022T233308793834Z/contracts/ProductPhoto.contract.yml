spec-version: 1.0.0
name: ProductPhoto
namespace: source
dataAssetResourceName: datastore://source/ProductPhoto
doc: Product photo records from the source ProductPhoto table, holding a thumbnail
  and a large image, with their file names, for each photo. The contract enforces
  the declared schema and the business key ProductPhotoID. Ownership and agreement
  are to be settled at the human-in-the-loop checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: ProductPhotoID
  description: Unique identifier of the product photo. It is the business key of the
    asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ThumbNailPhoto
  description: Binary content of the small thumbnail image of the product.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ThumbnailPhotoFileName
  description: File name of the thumbnail image.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
