spec-version: 1.0.0
name: Product
namespace: source
dataAssetResourceName: datastore://source/Product
doc: Product master data staged from the source Product table. It covers identity,
  manufacturing and sales attributes, pricing and cost, physical characteristics,
  classification links, and sell/discontinue lifecycle dates. The contract enforces
  the declared schema and the business key. No value-level constraints are stated
  in the requirements, so none are asserted. Ownership and agreement are left to human
  review.
