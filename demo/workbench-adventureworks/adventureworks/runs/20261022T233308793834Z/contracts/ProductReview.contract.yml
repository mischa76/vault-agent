spec-version: 1.0.0
name: ProductReview
namespace: source
dataAssetResourceName: datastore://source/ProductReview
doc: Customer-submitted product reviews, one row per review, linked to a product.
  The contract enforces the declared schema, the business key and not-null rules propagated
  by the deterministic core. Value-level constraints are not specified in the requirements,
  so none are asserted; ownership and agreement are to be settled at the human-in-the-loop
  checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: ProductReviewID
  description: Unique identifier of the product review.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ProductID
  description: Identifier of the product being reviewed; references the Product asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
