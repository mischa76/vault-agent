spec-version: 1.0.0
name: WorkOrderRouting
namespace: source
dataAssetResourceName: datastore://source/WorkOrderRouting
doc: 'Routing steps for manufacturing work orders: each record describes one operation
  (by sequence) performed at a location for a product within a work order, with scheduled
  and actual dates, resource hours, and planned vs. actual cost. Contract enforces
  the declared schema, business keys and not-null rules; no value-level thresholds
  are stated in the requirements.'
owner:
  name: John Doe
  email: john.doe@acme.com
