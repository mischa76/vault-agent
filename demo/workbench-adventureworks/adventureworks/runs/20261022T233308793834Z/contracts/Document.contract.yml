spec-version: 1.0.0
name: Document
namespace: source
dataAssetResourceName: datastore://source/Document
doc: Source-to-staging asset for product documents (for example maintenance or specification
  files) from the Production source. Each record is identified by its DocumentNode
  business key and carries hierarchy position, title, owner, file metadata, revision
  and status information, summary text, the document content, a row GUID and a modification
  timestamp. The contract enforces the declared schema and key. No value-level constraints
  are specified in the requirements, so none are asserted. Types marked unknown need
  human review.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
