spec-version: 1.0.0
name: Password
namespace: source
dataAssetResourceName: datastore://source/Password
doc: Source-to-staging asset for the Password table, which holds credential data (password
  hash and salt) for a business entity (person). The contract enforces the declared
  schema, business key and not-null rules deterministically; value-level semantics
  are not yet specified by requirements and are left for producer/consumer negotiation.
  Contains sensitive credential data and should be reviewed for access and handling.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: BusinessEntityID
  description: Identifier of the business entity (person) to which this password record
    belongs; references the BusinessEntity/Person record.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PasswordHash
  description: Hash of the password for the business entity. Sensitive credential
    data; not the plain-text password.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PasswordSalt
  description: Random salt value used when computing the password hash. Sensitive
    credential data.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: rowguid
  description: Globally unique identifier (GUID) for the row, used as a row-level
    unique identifier by the source system.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time when the source record was last modified.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
