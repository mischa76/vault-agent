spec-version: 1.0.0
name: PersonPhone
namespace: source
dataAssetResourceName: datastore://source/PersonPhone
doc: 'Staging contract for PersonPhone: the telephone numbers associated with a person,
  together with the phone number type (e.g., cell, home, work). Each record links
  a person (BusinessEntityID) to a phone number and its type. Ownership and agreement
  are to be confirmed at the human-in-the-loop checkpoint; schema, primary-key and
  not-null breaches are enforced by the deterministic core.'
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: BusinessEntityID
  description: Identifier of the business entity (person) that the phone number belongs
    to; references the Person/BusinessEntity record.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PhoneNumber
  description: Telephone number of the person, as recorded in the source system.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PhoneNumberTypeID
  description: Identifier of the kind of phone number (e.g., cell, home, work); references
    PhoneNumberType.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the source record was last modified.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
