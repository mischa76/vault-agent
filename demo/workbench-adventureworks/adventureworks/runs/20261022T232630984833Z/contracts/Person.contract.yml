spec-version: 1.0.0
name: Person
namespace: source
dataAssetResourceName: datastore://source/Person
doc: 'Staging contract for the Person source table: one row per individual (employee,
  customer contact, vendor contact, etc.) identified by BusinessEntityID. Enforces
  the declared schema, business-key uniqueness and not-null rules; value-level semantics
  are minimal because no further requirements were stated. Ownership and agreement
  are to be confirmed at the human-in-the-loop checkpoint.'
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: BusinessEntityID
  description: Identifier of the business entity this person belongs to; business
    key of the Person record and reference to BusinessEntity.
  examples: []
  constraints:
    primaryKey: true
