spec-version: 1.0.0
name: PurchaseOrderDetail
namespace: source
dataAssetResourceName: datastore://source/PurchaseOrderDetail
doc: Line-item detail of a purchase order, one row per product ordered on a purchase
  order, sourced from PurchaseOrderDetail into staging. The contract enforces the
  declared schema, business keys (PurchaseOrderID, PurchaseOrderDetailID) and not-null
  rules; value-level semantics are left for producer/consumer negotiation.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: PurchaseOrderID
  description: Identifier of the purchase order (header) this line item belongs to;
    references PurchaseOrderHeader.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PurchaseOrderDetailID
  description: Identifier of the line item within the purchase order detail table.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: DueDate
  description: Date by which the ordered product is expected to be delivered.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: OrderQty
  description: Quantity of the product ordered on this line.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ProductID
  description: Identifier of the product ordered on this line.
  examples: []
  constraints:
