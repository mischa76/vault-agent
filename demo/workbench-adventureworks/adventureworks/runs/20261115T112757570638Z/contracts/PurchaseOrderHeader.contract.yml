spec-version: 1.0.0
name: PurchaseOrderHeader
namespace: source
dataAssetResourceName: datastore://source/PurchaseOrderHeader
doc: Purchase order header records from the source system, one row per purchase order,
  covering vendor, employee, ship method, order/ship dates and monetary totals. The
  contract enforces the declared schema, business key and not-null rules; value-level
  semantics are minimal pending producer/consumer review.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: PurchaseOrderID
  description: Unique identifier of the purchase order (business key).
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: RevisionNumber
  description: Revision number tracking changes to the purchase order.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Status
