spec-version: 1.0.0
name: ShipMethod
namespace: source
dataAssetResourceName: datastore://source/ShipMethod
doc: Shipping method reference data (source ShipMethod) staged from the purchasing
  source. Each row is a shipping method with its base and per-unit rate. The contract
  enforces the declared schema, the business key (ShipMethodID) and not-null rules;
  value-level semantics are advisory.
owner:
  name: John Doe
  email: john.doe@acme.com
