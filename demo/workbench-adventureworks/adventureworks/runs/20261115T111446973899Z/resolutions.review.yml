# Entity resolution against the existing vault — review & ratify (WP29).
# resolution: <existing construct name> | NEW | same_as_candidate | unresolved
# Then:  vault-agent resume --resolutions <this file>
# Or:    vault-agent resume --resolve "concept=hub_name"
# A merge is applied ONLY after you ratify it — an unratified proposal never
# steers the modeler, because a wrong merge writes foreign keys into live history.
resolutions:
- concept: employee::national identification number (NationalIDNumber)
  resolution: NEW
  category: comment_grounded
  evidence:
  - Employee.NationalIDNumber is a national ID (e.g. social security number). No existing
    hub has this as a business key.
  - No cross-reference ties it to BusinessEntityID or to any existing hub.
  confidence: 0.6
  ratification_status: accepted
- concept: employee::company-wide business entity number (BusinessEntityID)
  resolution: hub_business_entity
  category: comment_grounded
  evidence:
  - 'Employee.BusinessEntityID comment: ''Foreign key to BusinessEntity.BusinessEntityID''.'
  - hub_business_entity already uses BusinessEntityID as its business key, so the
    key is the same identifier.
  confidence: 0.95
  ratification_status: accepted
- concept: employee::network login (LoginID)
  resolution: NEW
  category: comment_grounded
  evidence:
  - LoginID is a network login on Employee. No existing hub keys on it.
  - sat_business_entity_credential holds credentials, but nothing states LoginID is
    the same data, and a similar name is not evidence.
  confidence: 0.55
  ratification_status: accepted
- concept: employee::technical row identifier (rowguid)
