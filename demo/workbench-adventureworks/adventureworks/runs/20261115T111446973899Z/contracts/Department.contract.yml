spec-version: 1.0.0
name: Department
namespace: source
dataAssetResourceName: datastore://source/Department
doc: 'Staging contract for the Department source table: organizational departments
  and the group each belongs to. DepartmentID identifies each record; schema, primary-key
  and not-null breaches are enforced as hard failures. Ownership and agreement remain
  to be confirmed at the human-in-the-loop checkpoint.'
owner:
  name: John Doe
  email: john.doe@acme.com
