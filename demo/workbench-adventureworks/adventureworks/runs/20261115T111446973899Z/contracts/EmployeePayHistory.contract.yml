spec-version: 1.0.0
name: EmployeePayHistory
namespace: source
dataAssetResourceName: datastore://source/EmployeePayHistory
doc: 'Staging asset for employee pay history: one record per employee per pay rate
  change, capturing the rate and pay frequency effective from the rate change date.
  The contract enforces the declared schema, business-key uniqueness and not-null
  on keys; value-level checks are soft (alerting) unless a requirement mandates otherwise.
  Ownership and agreement are to be confirmed at human review.'
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: BusinessEntityID
  description: Identifier of the employee whose pay rate changed; references the employee
    (Employee.BusinessEntityID).
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: RateChangeDate
  description: Date on which the employee's pay rate change took effect.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Rate
  description: Pay rate for the employee as of the rate change date.
  examples: []
  constraints:
    primaryKey: false
    data_type: number
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PayFrequency
  description: Code indicating how often the employee is paid. The allowed value set
    is not specified in the requirements.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the source record was last modified.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
