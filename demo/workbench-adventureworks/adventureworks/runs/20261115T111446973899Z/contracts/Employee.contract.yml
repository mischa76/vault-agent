spec-version: 1.0.0
name: Employee
namespace: source
dataAssetResourceName: datastore://source/Employee
doc: Employee master records sourced from the Employee source table and loaded to
  staging. One record per employee, identified by BusinessEntityID. The contract enforces
  schema conformance, primary key uniqueness and not-null on key fields; value-level
  semantics are advisory pending producer/consumer review.
owner:
  name: John Doe
  email: john.doe@acme.com
