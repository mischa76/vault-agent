spec-version: 1.0.0
name: Shift
namespace: source
dataAssetResourceName: datastore://source/Shift
doc: Work shift reference data (e.g. a named daily time window) from the source Shift
  table, staged for the data vault. The contract enforces the declared schema and
  the business key (ShiftID); no further value-level constraints are stated in the
  requirements.
owner:
  name: John Doe
  email: john.doe@acme.com
