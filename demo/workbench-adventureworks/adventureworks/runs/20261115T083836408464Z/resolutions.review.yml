# Entity resolution against the existing vault — review & ratify (WP29).
# resolution: <existing construct name> | NEW | same_as_candidate | unresolved
# Then:  vault-agent resume --resolutions <this file>
# Or:    vault-agent resume --resolve "concept=hub_name"
# A merge is applied ONLY after you ratify it — an unratified proposal never
# steers the modeler, because a wrong merge writes foreign keys into live history.
resolutions:
- concept: vendor::AccountNumber (vendor account number)
  resolution: unresolved
  category: comment_grounded
  evidence:
  - Vendor.AccountNumber is nvarchar(15), a vendor-specific identifier. No existing
    hub uses it as a business key.
  - Vendor.BusinessEntityID is an FK to BusinessEntity, so the vendor is a business
    entity. AccountNumber is a different, alternate key for that same thing.
  - No mapping or comment states whether AccountNumber should be its own hub or an
    attribute of hub_business_entity, so a human should decide.
  confidence: 0.4
  ratification_status: accepted
- concept: vendor::BusinessEntityID (internal business entity identifier)
  resolution: hub_business_entity
  category: comment_grounded
  evidence:
  - 'Vendor.BusinessEntityID comment: ''Foreign key to BusinessEntity.BusinessEntityID''.
    This is an explicit cross-reference.'
  - hub_business_entity has business key BusinessEntityID and source entity BusinessEntity.
    It is already fed by Person and Employee, which share the same key, so a vendor
    is another role of the same key.
  confidence: 0.88
  ratification_status: accepted
