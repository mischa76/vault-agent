spec-version: 1.0.0
name: ShipMethod
namespace: source
dataAssetResourceName: datastore://source/ShipMethod
doc: Shipping method lookup from the source system, listing carriers/delivery options
  available for purchase orders along with their base and per-unit shipping charges.
  The contract enforces the declared schema and business-key identity of ShipMethodID;
  value-level semantics are alert-only pending producer/consumer review.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: ShipMethodID
  description: Unique identifier of the shipping method; business key of the asset.
    Referenced by purchase order headers.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Name
  description: Name of the shipping method.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ShipBase
  description: Minimum shipping charge for the method.
  examples: []
  constraints:
    primaryKey: false
    data_type: number
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ShipRate
  description: Shipping charge per unit of measure (e.g. per weight) applied in addition
    to the base charge.
  examples: []
  constraints:
    primaryKey: false
    data_type: number
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: rowguid
  description: Globally unique row identifier (GUID) assigned by the source system.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the source record was last modified.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
