spec-version: 1.0.0
name: ProductVendor
namespace: source
dataAssetResourceName: datastore://source/ProductVendor
doc: Source-to-staging asset linking a product to a vendor that supplies it, with
  purchasing terms such as lead time, pricing, receipt history, and order quantity
  limits. The contract enforces the declared schema, business keys (ProductID, BusinessEntityID),
  and not-null rules; no value-level thresholds are stated in the requirements. Ownership
  and agreement are to be settled at the human-in-the-loop checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: ProductID
  description: Identifier of the product supplied by the vendor. Part of the business
    key; references the product.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: BusinessEntityID
  description: Identifier of the vendor (business entity) supplying the product. Part
    of the business key; corresponds to the Vendor business entity.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: AverageLeadTime
  description: Average lead time for the vendor to deliver the product after an order
    is placed.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: StandardPrice
  description: Standard price of the product from this vendor.
  examples: []
  constraints:
    primaryKey: false
    data_type: number
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: LastReceiptCost
  description: Unit cost of the product at the most recent receipt from the vendor.
  examples: []
  constraints:
    primaryKey: false
    data_type: number
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: LastReceiptDate
  description: Date the product was last received from the vendor.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: MinOrderQty
  description: Minimum quantity that can be ordered from the vendor for this product.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: MaxOrderQty
  description: Maximum quantity that can be ordered from the vendor for this product.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
