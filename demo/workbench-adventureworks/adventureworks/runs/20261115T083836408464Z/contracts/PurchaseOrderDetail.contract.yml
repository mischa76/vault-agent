spec-version: 1.0.0
name: PurchaseOrderDetail
namespace: source
dataAssetResourceName: datastore://source/PurchaseOrderDetail
doc: Line-level detail of a purchase order, one record per product line on a purchase
  order, sourced from the PurchaseOrderDetail source table. The contract enforces
  the declared schema, business-key uniqueness and not-null rules; no value-level
  thresholds have been stated in the requirements, so none are asserted. Ownership
  and agreement are to be confirmed at the human-in-the-loop checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: PurchaseOrderID
  description: Identifier of the purchase order this line belongs to (references the
    purchase order header).
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PurchaseOrderDetailID
  description: Identifier of the individual line item within the purchase order detail
    records.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: DueDate
  description: Date by which the ordered product line is expected to be delivered.
  examples: []
  constraints:
    primaryKey: false
