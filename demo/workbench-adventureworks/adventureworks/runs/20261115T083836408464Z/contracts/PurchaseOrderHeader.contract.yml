spec-version: 1.0.0
name: PurchaseOrderHeader
namespace: source
dataAssetResourceName: datastore://source/PurchaseOrderHeader
doc: Purchase order header records from the source system, one row per purchase order,
  with vendor, employee, shipping method, dates, and monetary totals. The contract
  enforces the declared schema and business-key uniqueness/not-null; value-level semantics
  are minimal because no further requirements were stated and are subject to human
  review.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: PurchaseOrderID
  description: Unique identifier of the purchase order (business key).
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: RevisionNumber
  description: Revision number of the purchase order, tracking changes to the order.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Status
  description: Status code of the purchase order. Allowed values are not specified
    in the requirements.
  examples: []
  constraints:
    primaryKey: false
