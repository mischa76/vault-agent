spec-version: 1.0.0
name: SalesOrderDetail
namespace: source
dataAssetResourceName: datastore://source/SalesOrderDetail
doc: 'Line-item detail of a sales order: one row per product line on a sales order,
  including quantity, pricing, discount and line total. Contract enforces the declared
  schema and business-key identity; value-level semantics are advisory pending producer/consumer
  review.'
owner:
  name: John Doe
  email: john.doe@acme.com
