spec-version: 1.0.0
name: Currency
namespace: source
dataAssetResourceName: datastore://source/Currency
doc: Reference list of currencies from the source Sales.Currency table, keyed by CurrencyCode.
  The contract enforces the declared schema and business-key uniqueness/non-nullness
  (handled by the deterministic core). Ownership and agreement are pending human review.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: CurrencyCode
  description: Business key identifying the currency (currency code, e.g. a three-letter
    code).
  examples:
  - USD
  - EUR
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Name
  description: Descriptive name of the currency.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the source record was last modified.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
