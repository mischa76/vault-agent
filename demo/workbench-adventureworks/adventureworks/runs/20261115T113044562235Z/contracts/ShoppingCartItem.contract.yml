spec-version: 1.0.0
name: ShoppingCartItem
namespace: source
dataAssetResourceName: datastore://source/ShoppingCartItem
doc: Items placed in an online shopping cart, as captured in the Sales source. Each
  row is one product line in a cart. The contract enforces the declared schema, business-key
  uniqueness and not-null rules; value-level constraints are not stated in the requirements.
owner:
  name: John Doe
  email: john.doe@acme.com
