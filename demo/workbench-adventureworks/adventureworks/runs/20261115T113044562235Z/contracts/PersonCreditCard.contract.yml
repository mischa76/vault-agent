spec-version: 1.0.0
name: PersonCreditCard
namespace: source
dataAssetResourceName: datastore://source/PersonCreditCard
doc: Association between a person (business entity) and a credit card, sourced from
  the Sales.PersonCreditCard table and staged as-is. The contract enforces the presence
  and types of BusinessEntityID, CreditCardID and ModifiedDate; key and not-null checks
  are handled by the deterministic core. Ownership and agreement are to be confirmed
  at the human-in-the-loop checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: BusinessEntityID
  description: Identifier of the business entity (person) that holds the credit card.
    Reference to the person/business entity record.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: CreditCardID
  description: Identifier of the credit card associated with the person. Reference
    to the CreditCard record.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the association record was last modified in the source.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
