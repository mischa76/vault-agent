spec-version: 1.0.0
name: SalesOrderHeaderSalesReason
namespace: source
dataAssetResourceName: datastore://source/SalesOrderHeaderSalesReason
doc: Association between sales orders and the sales reasons recorded for them (a many-to-many
  link between SalesOrderHeader and SalesReason). The contract enforces the schema
  and the composite key of SalesOrderID and SalesReasonID. Ownership and agreement
  status are left for human review.
owner:
  name: John Doe
  email: john.doe@acme.com
