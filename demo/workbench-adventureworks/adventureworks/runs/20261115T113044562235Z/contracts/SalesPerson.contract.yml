spec-version: 1.0.0
name: SalesPerson
namespace: source
dataAssetResourceName: datastore://source/SalesPerson
doc: Sales representatives (salespeople) with their assigned sales territory, quota,
  bonus, commission percentage and sales totals, staged from the source SalesPerson
  table. The contract enforces the declared schema, business key and not-null constraints;
  no value-level thresholds are stated in the requirements.
owner:
  name: John Doe
  email: john.doe@acme.com
