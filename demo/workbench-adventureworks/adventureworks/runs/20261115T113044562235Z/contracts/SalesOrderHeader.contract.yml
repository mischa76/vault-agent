spec-version: 1.0.0
name: SalesOrderHeader
namespace: source
dataAssetResourceName: datastore://source/SalesOrderHeader
doc: Sales order header records from the source system, one row per sales order, carrying
  order dates, status, customer/sales person/territory references, shipping and billing
  references, and monetary totals. The contract enforces the declared schema and business
  key (SalesOrderID). No value-level semantic constraints are asserted because none
  are stated in the requirements. Ownership and agreement remain to be settled at
  the human-in-the-loop checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
