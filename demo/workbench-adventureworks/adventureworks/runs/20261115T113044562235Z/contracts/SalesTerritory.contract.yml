name: SalesTerritory
namespace: source
dataAssetResourceName: datastore://source/SalesTerritory
doc: Sales territory reference data from the source system, one record per territory,
  including its country/region, sales group, and year-to-date and prior-year sales
  and cost figures. The contract enforces the declared schema, business key (TerritoryID)
  and not-null rules; value-level semantics are advisory pending producer/consumer
  review.
