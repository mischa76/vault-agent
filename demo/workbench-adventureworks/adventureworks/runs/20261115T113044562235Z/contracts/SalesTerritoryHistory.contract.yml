spec-version: 1.0.0
name: SalesTerritoryHistory
namespace: source
dataAssetResourceName: datastore://source/SalesTerritoryHistory
doc: Historical record of the sales territories assigned to each salesperson over
  time, with the start and end dates of each assignment. Staged from the source SalesTerritoryHistory
  table. The contract enforces the declared schema and business-key constraints. Ownership
  and agreement status are left for human review.
owner:
  name: John Doe
  email: john.doe@acme.com
