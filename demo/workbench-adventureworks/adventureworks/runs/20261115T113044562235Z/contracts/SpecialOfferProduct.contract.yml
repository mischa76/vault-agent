spec-version: 1.0.0
name: SpecialOfferProduct
namespace: source
dataAssetResourceName: datastore://source/SpecialOfferProduct
doc: Associative record linking a special offer to a product it applies to (many-to-many
  between SpecialOffer and Product). The contract enforces the schema and the business
  keys (SpecialOfferID, ProductID); ownership and agreement are to be confirmed at
  human review.
owner:
  name: John Doe
  email: john.doe@acme.com
