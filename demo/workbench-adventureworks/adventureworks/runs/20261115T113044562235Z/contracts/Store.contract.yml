spec-version: 1.0.0
name: Store
namespace: source
dataAssetResourceName: datastore://source/Store
doc: Source-to-staging asset representing stores (retail customers) from the Sales
  schema. The contract enforces the declared field set and schema; primary key and
  not-null rules are propagated deterministically from the business keys. Ownership
  and agreement are to be confirmed at the human-in-the-loop checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
