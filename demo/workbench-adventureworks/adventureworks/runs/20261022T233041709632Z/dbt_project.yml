# Generated by vault-agent — dbt project scaffolding for the generated Data Vault.
# Define a matching connection profile named 'vault_project' in profiles.yml
# (see README.md); then: dbt deps && dbt build.
name: 'vault_project'
version: '1.0.0'
config-version: 2

profile: 'vault_project'

model-paths: ["models"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  vault_project:
    staging:
      # Thin view layer (hash keys / hashdiffs); no need to persist it.
      +materialized: view
    raw_vault:
      # The generated models already carry config(materialized='incremental');
      # this is a belt-and-braces default.
      +materialized: incremental

seeds:
  vault_project:
    # Keep seed column headers UNQUOTED so UPPER_SNAKE identifiers fold consistently
    # with the (also unquoted) identifiers AutomateDV emits (verified on Postgres —
    # see demo/bank_postgres in the vault-agent repo).
    +quote_columns: false
    # Column types pinned from the drafted data contracts (never inferred);
    # columns with an undetermined contract type are omitted and left to dbt's
    # seed inference, so a gap stays visible instead of being guessed at.
    Employee:
      +column_types:
        BUSINESSENTITYID: bigint
        NATIONALIDNUMBER: varchar
        LOGINID: varchar
        ORGANIZATIONNODE: varchar
        ORGANIZATIONLEVEL: bigint
        JOBTITLE: varchar
        BIRTHDATE: varchar
        MARITALSTATUS: varchar
        GENDER: varchar
        HIREDATE: varchar
        SALARIEDFLAG: boolean
        VACATIONHOURS: bigint
        SICKLEAVEHOURS: bigint
        CURRENTFLAG: boolean
        ROWGUID: varchar
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
    EmployeePayHistory:
      +column_types:
        BUSINESSENTITYID: bigint
        RATECHANGEDATE: varchar
        RATE: numeric
        PAYFREQUENCY: bigint
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
    Department:
      +column_types:
        DEPARTMENTID: bigint
        NAME: varchar
        GROUPNAME: varchar
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
    Shift:
      +column_types:
        SHIFTID: bigint
        NAME: varchar
        STARTTIME: varchar
        ENDTIME: varchar
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
    JobCandidate:
      +column_types:
        JOBCANDIDATEID: bigint
        BUSINESSENTITYID: bigint
        RESUME: varchar
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
    EmployeeDepartmentHistory:
      +column_types:
        BUSINESSENTITYID: bigint
        DEPARTMENTID: bigint
        SHIFTID: bigint
        STARTDATE: varchar
        ENDDATE: varchar
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
