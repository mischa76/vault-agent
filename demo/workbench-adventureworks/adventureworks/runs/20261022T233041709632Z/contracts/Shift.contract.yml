spec-version: 1.0.0
name: Shift
namespace: source
dataAssetResourceName: datastore://source/Shift
doc: Work shift reference data from the source Shift table, describing named shifts
  and their daily start and end times. The contract enforces the declared schema and
  business-key uniqueness and non-null checks. Ownership and agreement status are
  left for human-in-the-loop review.
owner:
  name: John Doe
  email: john.doe@acme.com
