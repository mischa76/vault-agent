spec-version: 1.0.0
name: EmployeeDepartmentHistory
namespace: source
dataAssetResourceName: datastore://source/EmployeeDepartmentHistory
doc: Historical record of the departments and shifts an employee has been assigned
  to over time, one row per employee/department/shift/start-date assignment. The contract
  enforces the declared schema, business keys and not-null rules; value-level semantics
  are left for producer/consumer review.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: BusinessEntityID
  description: Identifier of the employee (references Employee.BusinessEntityID) to
    whom this department assignment belongs.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: DepartmentID
  description: Identifier of the department the employee was assigned to (references
    Department.DepartmentID).
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ShiftID
  description: Identifier of the work shift the employee was assigned to (references
    Shift.ShiftID).
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: StartDate
  description: Date the employee started working in the department on the given shift.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: EndDate
  description: Date the employee stopped working in the department; absent/null when
    the assignment is current.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the source record was last modified.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
