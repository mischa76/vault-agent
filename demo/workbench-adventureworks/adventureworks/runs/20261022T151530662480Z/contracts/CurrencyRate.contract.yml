spec-version: 1.0.0
name: CurrencyRate
namespace: source
dataAssetResourceName: datastore://source/CurrencyRate
doc: Currency exchange rates between a source and target currency for a given date,
  staged from the source CurrencyRate table. The contract enforces the declared schema,
  business key and not-null rules; value-level semantics are not yet specified by
  requirements and are left for producer/consumer negotiation.
