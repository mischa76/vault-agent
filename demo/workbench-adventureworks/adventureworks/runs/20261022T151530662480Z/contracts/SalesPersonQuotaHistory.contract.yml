spec-version: 1.0.0
name: SalesPersonQuotaHistory
namespace: source
dataAssetResourceName: datastore://source/SalesPersonQuotaHistory
doc: Historical record of sales quotas assigned to sales people, one row per sales
  person and quota date. Source-to-staging contract for SalesPersonQuotaHistory; enforces
  schema, primary-key and not-null constraints. Ownership and agreement are to be
  confirmed at the human-in-the-loop checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: BusinessEntityID
  description: Identifier of the sales person (business entity) the quota applies
    to.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: QuotaDate
  description: Date on which the sales quota took effect for the sales person.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: SalesQuota
  description: Sales quota amount assigned to the sales person for the quota date.
  examples: []
  constraints:
    primaryKey: false
    data_type: number
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: rowguid
  description: Unique row identifier (GUID) used by the source system.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Timestamp when the source row was last modified.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
