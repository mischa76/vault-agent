spec-version: 1.0.0
name: SalesOrderHeader
namespace: source
dataAssetResourceName: datastore://source/SalesOrderHeader
doc: Sales order header records staged from the source SalesOrderHeader table. Each
  record is one sales order, with its dates, status, customer, sales person, territory,
  address, shipping, payment and currency references, and monetary totals. The contract
  enforces the declared schema and business keys. No value-level semantic constraints
  are asserted, because the requirements state none. Field types and descriptions
  are bootstrapped from column names only and need human review. Ownership is not
  set here and is to be agreed at the human-in-the-loop checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
