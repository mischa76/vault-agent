spec-version: 1.0.0
name: SpecialOffer
namespace: source
dataAssetResourceName: datastore://source/SpecialOffer
doc: Sales discount offers (special offers) from the source-to-staging load, one record
  per offer, identified by SpecialOfferID. Describes the offer, its discount percentage,
  type and category, validity window and quantity range. Contract enforces the declared
  schema, primary key and not-null rules; value-level semantics are soft alerts pending
  producer/consumer review.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
