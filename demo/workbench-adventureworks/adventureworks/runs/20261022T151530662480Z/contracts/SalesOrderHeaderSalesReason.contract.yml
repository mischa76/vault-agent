spec-version: 1.0.0
name: SalesOrderHeaderSalesReason
namespace: source
dataAssetResourceName: datastore://source/SalesOrderHeaderSalesReason
doc: Association between a sales order header and the sales reason(s) recorded for
  that order (many-to-many link between SalesOrderHeader and SalesReason). Contract
  enforces the declared schema, business-key uniqueness and not-null on key fields;
  ownership is to be confirmed at the human-in-the-loop checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: SalesOrderID
  description: Identifier of the sales order header this reason applies to; references
    SalesOrderHeader.SalesOrderID.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: SalesReasonID
  description: Identifier of the sales reason recorded for the order; references SalesReason.SalesReasonID.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the record was last modified in the source system.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
