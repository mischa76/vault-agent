spec-version: 1.0.0
name: Customer
namespace: source
dataAssetResourceName: datastore://source/Customer
doc: 'Customer source-to-staging asset: a customer of the sales business, which may
  be an individual (linked via PersonID) or a store (linked via StoreID). The contract
  enforces the declared schema, business-key uniqueness and not-null rules; value-level
  semantics are advisory pending producer/consumer review.'
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: CustomerID
  description: Unique identifier of the customer record.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PersonID
  description: Identifier of the individual person associated with the customer; may
    be absent for store customers.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: StoreID
  description: Identifier of the store associated with the customer; may be absent
    for individual customers.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: TerritoryID
  description: Identifier of the sales territory the customer belongs to.
