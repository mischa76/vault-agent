  failure_mode: hard
- name: SalesYTD
  description: Sales total for the sales person year to date.
  examples: []
  constraints:
    primaryKey: false
    data_type: number
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: SalesLastYear
  description: Sales total for the sales person in the previous year.
  examples: []
  constraints:
    primaryKey: false
