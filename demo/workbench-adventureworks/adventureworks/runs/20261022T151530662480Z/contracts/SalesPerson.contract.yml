spec-version: 1.0.0
name: SalesPerson
namespace: source
dataAssetResourceName: datastore://source/SalesPerson
doc: 'Staging asset for SalesPerson: one record per sales person, with territory assignment,
  quota, bonus, commission percentage and sales totals. The contract enforces the
  declared schema, business key and not-null rules; ownership and agreement are left
  to human review.'
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: BusinessEntityID
  description: Identifier of the business entity (employee) that is the sales person;
    business key for the asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: TerritoryID
  description: Identifier of the sales territory currently assigned to the sales person,
    if any.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: SalesQuota
  description: Projected sales target for the sales person, if one is set.
  examples: []
  constraints:
    primaryKey: false
    data_type: number
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Bonus
  description: Bonus amount due to the sales person.
  examples: []
  constraints:
    primaryKey: false
    data_type: number
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: CommissionPct
  description: Commission percentage received per sale.
  examples: []
  constraints:
    primaryKey: false
    data_type: number
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
