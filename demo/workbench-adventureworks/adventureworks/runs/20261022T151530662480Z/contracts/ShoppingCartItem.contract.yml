spec-version: 1.0.0
name: ShoppingCartItem
namespace: source
dataAssetResourceName: datastore://source/ShoppingCartItem
doc: Items placed in an online shopping cart, as staged from the Sales.ShoppingCartItem
  source table. Each row is one product line in a cart. The contract enforces the
  declared schema, business-key uniqueness and not-null rules (applied deterministically);
  no value-level thresholds are stated in the requirements.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: ShoppingCartItemID
  description: Unique identifier for a shopping cart item row.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ShoppingCartID
  description: Identifier of the shopping cart that the item belongs to.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
