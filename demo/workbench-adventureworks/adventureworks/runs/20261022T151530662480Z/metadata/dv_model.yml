- business_key: ProductID
  business_key_columns: []
  description: Product master. ProductNumber is the business-recognised natural key
    (REQ-002), but every dependent relation (inventory, work orders, BOM, cost/price
    history, transactions, reviews, photos, documents) carries only ProductID. The
    hub is therefore anchored on ProductID so those relations can attach, and ProductNumber
    is kept as a descriptive attribute.
  name: hub_product
  requirement_ids:
  - REQ-001
  - REQ-002
  - REQ-048-3
  source_entity: Product
  sources: []
- business_key: ProductCategoryID
  business_key_columns: []
  description: Top level of the merchandising hierarchy. Anchored on the ID because
    ProductSubcategory references categories by ID; Name is kept in a satellite.
  name: hub_product_category
  requirement_ids:
  - REQ-032
  - REQ-033
  source_entity: ProductCategory
  sources: []
- business_key: ProductSubcategoryID
  business_key_columns: []
  description: Second level of the merchandising hierarchy. Anchored on the ID because
    Product references subcategories by ID; Name is kept in a satellite.
