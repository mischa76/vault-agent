    source_table: Password
  - business_key_column: BusinessEntityID
    source_table: Employee
  - business_key_column: BusinessEntityID
    source_table: EmployeePayHistory
  - business_key_column: BusinessEntityID
    source_table: Vendor
  - business_key_column: BusinessEntityID
    source_table: Store
  - business_key_column: BusinessEntityID
    source_table: SalesPerson
  - business_key_column: BusinessEntityID
    source_table: SalesPersonQuotaHistory
