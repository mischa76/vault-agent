hubs:
- business_key: BusinessEntityID
  business_key_columns: []
  description: Company-wide party register (customers, vendors, employees, stores,
    persons). Persons share the same business entity number, so person data attaches
    here as satellites rather than a separate hub. Email addresses and credentials
    are keyed by the same number and are declared as feeds so their satellites bind
    to their own source.
  name: hub_business_entity
  requirement_ids:
  - REQ-001
  - REQ-002
  - REQ-003
  - REQ-004
  - REQ-008
  - REQ-009
  - REQ-034
  - REQ-050
  - REQ-065
  source_entity: BusinessEntity
  sources:
  - business_key_column: BusinessEntityID
    source_table: BusinessEntity
  - business_key_column: BusinessEntityID
    source_table: Person
  - business_key_column: BusinessEntityID
    source_table: EmailAddress
