        BUSINESSENTITYID: bigint
        QUOTADATE: varchar
        SALESQUOTA: numeric
        ROWGUID: varchar
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
    Customer:
