  - Customer.CustomerID is its own primary key ('Primary key.') and no existing hub
    has CustomerID as a business key.
  - Customer.PersonID and StoreID are only foreign keys to Person/Store. They show
    that a customer references a business entity, not that it is one.
  confidence: 0.85
  ratification_status: accepted
- concept: store::BusinessEntityID
  resolution: hub_business_entity
  category: exact_key
