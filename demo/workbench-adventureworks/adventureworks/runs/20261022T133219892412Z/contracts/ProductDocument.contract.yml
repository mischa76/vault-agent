spec-version: 1.0.0
name: ProductDocument
namespace: source
dataAssetResourceName: datastore://source/ProductDocument
doc: Link (association) asset relating products to their documents, sourced from the
  ProductDocument source table. The contract enforces the composite business key (ProductID,
  DocumentNode); schema, primary-key and not-null breaches are enforced by the deterministic
  core. Ownership and agreement are to be confirmed at the human-in-the-loop checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: ProductID
  description: Identifier of the product the document is associated with; references
    the Product asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: DocumentNode
  description: Identifier of the document node associated with the product; references
    the Document asset (hierarchical document identifier).
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the association record was last modified in the source
    system.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
