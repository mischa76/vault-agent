spec-version: 1.0.0
name: ProductReview
namespace: source
dataAssetResourceName: datastore://source/ProductReview
doc: Customer reviews submitted for products, staged from the source ProductReview
  table. Each record captures the reviewer, review date, contact email, rating and
  free-text comments for one product. The contract enforces the declared schema and
  business-key uniqueness/not-null rules; no additional value-level thresholds are
  stated in the requirements. Ownership is to be confirmed at the human-in-the-loop
  checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: ProductReviewID
  description: Unique identifier of the product review record.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ProductID
  description: Identifier of the product being reviewed; references the Product asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
