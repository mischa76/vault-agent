spec-version: 1.0.0
name: ProductModel
namespace: source
dataAssetResourceName: datastore://source/ProductModel
doc: Source-to-staging asset for product models (AdventureWorks Production.ProductModel).
  Each record represents a product model with its name, optional catalog description
  and manufacturing instructions. The contract enforces the declared schema and business-key
  constraints; ownership and agreement are to be confirmed at the human-in-the-loop
  checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
