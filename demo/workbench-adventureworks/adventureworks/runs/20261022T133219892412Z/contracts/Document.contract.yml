spec-version: 1.0.0
name: Document
namespace: source
dataAssetResourceName: datastore://source/Document
doc: 'Source-to-staging contract for Document: product documentation records (folders
  and files) identified by DocumentNode, with title, owner, file name/extension, revision,
  change number, status, summary, document content, rowguid and ModifiedDate. The
  contract enforces the declared schema, business-key identity and not-null rules;
  no value-level constraints are stated in the requirements, so none are asserted.
  Ownership and agreement are to be resolved at the human-in-the-loop checkpoint.'
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: DocumentNode
  description: Hierarchical node identifier of the document within the document tree;
    business key of the Document asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: DocumentLevel
  description: Depth of the document within the document hierarchy. Type not confirmed
    by requirements.
  examples: []
  constraints:
    primaryKey: false
    data_type: unknown
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Title
  description: Title of the document.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Owner
  description: Owner of the document (reference to the responsible person). Type and
    referenced entity not confirmed by requirements.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: FolderFlag
  description: Indicates whether the node is a folder (true) rather than a file (false).
  examples: []
  constraints:
    primaryKey: false
    data_type: boolean
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: FileName
  description: File name of the document.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: FileExtension
  description: File extension of the document (e.g. the type suffix of the file name).
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Revision
  description: Revision identifier of the document. Format not confirmed by requirements.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ChangeNumber
  description: Change number assigned to the document by the engineering change process.
    Type not confirmed by requirements.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Status
  description: Processing/approval status of the document. Allowed values are not
    stated in the requirements.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: DocumentSummary
  description: Free-text summary of the document.
  examples: []
  constraints:
