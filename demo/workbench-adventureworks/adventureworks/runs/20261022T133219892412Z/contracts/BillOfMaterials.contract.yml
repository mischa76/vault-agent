spec-version: 1.0.0
name: BillOfMaterials
namespace: source
dataAssetResourceName: datastore://source/BillOfMaterials
doc: Bill of materials relating each product assembly to its component products, including
  validity dates, unit of measure, BOM level and per-assembly quantity. Contract enforces
  the declared schema and business-key constraints; value-level semantics are left
  for producer/consumer review.
owner:
  name: John Doe
  email: john.doe@acme.com
