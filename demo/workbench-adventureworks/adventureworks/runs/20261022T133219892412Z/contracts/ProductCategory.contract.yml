spec-version: 1.0.0
name: ProductCategory
namespace: source
dataAssetResourceName: datastore://source/ProductCategory
doc: Top-level product categories (e.g. high-level groupings of products) sourced
  from the ProductCategory table and staged for the vault. The contract enforces the
  declared schema and the business key ProductCategoryID; ownership and agreement
  are to be confirmed at the human-in-the-loop checkpoint.
owner:
