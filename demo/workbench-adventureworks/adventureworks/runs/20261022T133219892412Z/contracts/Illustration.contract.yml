spec-version: 1.0.0
name: Illustration
namespace: source
dataAssetResourceName: datastore://source/Illustration
doc: Source-to-staging asset for product illustrations (Production.Illustration).
  Each record is one illustration identified by IllustrationID, holding a diagram
  and a last-modified timestamp. The contract enforces the declared schema and business
  key; no value-level thresholds are stated in the requirements.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: IllustrationID
  description: Identifier of the illustration; the business key of this asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Diagram
  description: Illustrations used in manufacturing instructions. The exact format
    and encoding are not stated in the requirements.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the record was last modified in the source.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
