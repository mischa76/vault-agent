spec-version: 1.0.0
name: ProductInventory
namespace: source
dataAssetResourceName: datastore://source/ProductInventory
doc: Product inventory records from the source system, representing the quantity of
  each product held at a given storage location (with shelf and bin). The contract
  enforces the declared schema, business-key uniqueness and not-null rules; value-level
  semantics are advisory pending producer/consumer review.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: ProductID
  description: Identifier of the product held in inventory; references the Product
    asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: LocationID
  description: Identifier of the inventory location where the product is stored; references
    the Location asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Shelf
  description: Storage compartment (shelf) identifier within the inventory location.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Bin
  description: Identifier of the bin within the shelf where the product is stored.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Quantity
  description: Number of units of the product held at the location, shelf and bin.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: rowguid
  description: Globally unique identifier (GUID) for the row, used by the source system
    for replication.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the source record was last modified.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
