spec-version: 1.0.0
name: Product
namespace: source
dataAssetResourceName: datastore://source/Product
doc: Product master data staged from the source Product table. Each record describes
  one product (manufactured or purchased) with identification, costing, pricing, physical
  attributes, classification and sales lifecycle dates. The contract enforces the
  declared schema and business key; no value-level constraints are stated in the requirements
  yet, so none are asserted and types marked 'unknown' need human review.
owner:
  name: John Doe
  email: john.doe@acme.com
