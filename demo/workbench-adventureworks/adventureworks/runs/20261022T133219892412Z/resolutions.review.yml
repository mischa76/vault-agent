# Entity resolution against the existing vault — review & ratify (WP29).
# resolution: <existing construct name> | NEW | same_as_candidate | unresolved
# Then:  vault-agent resume --resolutions <this file>
# Or:    vault-agent resume --resolve "concept=hub_name"
# A merge is applied ONLY after you ratify it — an unratified proposal never
# steers the modeler, because a wrong merge writes foreign keys into live history.
resolutions:
- concept: product::ProductNumber
  resolution: NEW
  category: semantic
  evidence:
  - Product.ProductNumber is 'Unique product identification number'. No existing hub
    models products; the hubs cover business entity, address, contact/phone/address
    types, country, state, department, shift and job candidate.
  confidence: 0.85
  ratification_status: accepted
- concept: product::ProductID
  resolution: NEW
  category: semantic
  evidence:
  - Product.ProductID is the primary key of Product. No existing hub has a product
    business key. It is referenced as a foreign key by many new tables but not by
    the existing vault.
  confidence: 0.92
  ratification_status: accepted
