  name: hub_state_province
  requirement_ids:
  - REQ-022-2
  - REQ-056
  source_entity: StateProvince
  sources: []
- business_key: DepartmentID
  business_key_columns: []
  description: Register of departments, the organisational units in which people work.
    Keyed on the stable DepartmentID because department names can change.
  name: hub_department
  requirement_ids:
  - REQ-031
  - REQ-032
  - REQ-035
  - REQ-043
  source_entity: Department
  sources: []
- business_key: ShiftID
  business_key_columns: []
  description: Register of eight-hour working shifts. Keyed on the stable ShiftID
    because shift names and definitions can be adjusted.
  name: hub_shift
  requirement_ids:
  - REQ-038
  - REQ-039
  - REQ-042
  source_entity: Shift
  sources: []
- business_key: JobCandidateID
  business_key_columns: []
  description: Job candidates whose applications are held by HR.
  name: hub_job_candidate
  requirement_ids:
  - REQ-068
  - REQ-072
  - REQ-090
  source_entity: JobCandidate
  sources: []
- business_key: ProductID
  business_key_columns: []
  description: Product master. ProductNumber is the business-recognised natural key
    (REQ-002), but every dependent relation (inventory, work orders, BOM, cost/price
    history, transactions, reviews, photos, documents) carries only ProductID. The
    hub is therefore anchored on ProductID so those relations can attach, and ProductNumber
    is kept as a descriptive attribute.
  name: hub_product
  requirement_ids:
  - REQ-001
  - REQ-002
  - REQ-048-3
  source_entity: Product
  sources: []
- business_key: ProductCategoryID
  business_key_columns: []
  description: Top level of the merchandising hierarchy. Anchored on the ID because
    ProductSubcategory references categories by ID; Name is kept in a satellite.
  name: hub_product_category
  requirement_ids:
  - REQ-032
  - REQ-033
  source_entity: ProductCategory
  sources: []
- business_key: ProductSubcategoryID
  business_key_columns: []
  description: Second level of the merchandising hierarchy. Anchored on the ID because
    Product references subcategories by ID; Name is kept in a satellite.
  name: hub_product_subcategory
  requirement_ids:
  - REQ-032
  - REQ-034
  source_entity: ProductSubcategory
  sources: []
- business_key: ProductModelID
  business_key_columns: []
  description: Product model shared by several products. Anchored on the ID because
    Product and the association tables reference models by ID; Name is kept in a satellite.
  name: hub_product_model
  requirement_ids:
  - REQ-040
  - REQ-041
  - REQ-044
  source_entity: ProductModel
  sources: []
- business_key: CultureID
  business_key_columns: []
  description: Language/locale designation, identified by a short culture code.
  name: hub_culture
  requirement_ids:
  - REQ-049
  source_entity: Culture
  sources: []
- business_key: UnitMeasureCode
  business_key_columns: []
  description: Standard unit of measure, identified by a short code.
  name: hub_unit_measure
  requirement_ids:
  - REQ-095
  - REQ-096
  source_entity: UnitMeasure
  sources: []
- business_key: ProductDescriptionID
  business_key_columns: []
  description: Free-text marketing description held in a library, independent of any
    one product.
