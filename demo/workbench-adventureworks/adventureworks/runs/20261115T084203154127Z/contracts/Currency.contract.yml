spec-version: 1.0.0
name: Currency
namespace: source
dataAssetResourceName: datastore://source/Currency
doc: Reference list of currencies from the source Sales.Currency table, staged for
  the data vault. The contract enforces the declared schema, the CurrencyCode business
  key and not-null constraints; ownership and agreement are to be confirmed at the
  human-in-the-loop checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: CurrencyCode
  description: Code identifying the currency; business key of the asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Name
  description: Name of the currency.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the source record was last modified.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
