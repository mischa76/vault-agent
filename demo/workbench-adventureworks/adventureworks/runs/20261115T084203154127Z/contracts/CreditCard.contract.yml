spec-version: 1.0.0
name: CreditCard
namespace: source
dataAssetResourceName: datastore://source/CreditCard
doc: 'Source-to-staging asset for credit card records from the Sales schema. Each
  record describes a payment card (type, number, expiry) identified by CreditCardID.
  This draft contract enforces the declared schema and business key; ownership and
  agreement are to be finalized at the human-in-the-loop checkpoint. Note: CardNumber
  is sensitive payment data and should be reviewed for masking/handling.'
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: CreditCardID
  description: Unique identifier of the credit card record (surrogate key in the source).
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: CardType
  description: Type or brand of the credit card (e.g. the card issuer/network).
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: CardNumber
  description: The credit card number. Sensitive payment data; handling and masking
    requirements to be confirmed by the reviewer.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ExpMonth
  description: Month of card expiration.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ExpYear
  description: Year of card expiration.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the record was last modified in the source.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
