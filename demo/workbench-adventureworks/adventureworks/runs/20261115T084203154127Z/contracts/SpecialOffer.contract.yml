spec-version: 1.0.0
name: SpecialOffer
namespace: source
dataAssetResourceName: datastore://source/SpecialOffer
doc: Sales promotions/discount offers (special offers) from the source SpecialOffer
  table, staged for the vault. Each record is identified by SpecialOfferID and describes
  the discount, offer type and category, validity window, and quantity bounds. Contract
  enforces the declared schema, primary key and not-null rules; value-level semantics
  are advisory pending producer/consumer review.
