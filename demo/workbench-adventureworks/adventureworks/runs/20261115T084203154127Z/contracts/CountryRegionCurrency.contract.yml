spec-version: 1.0.0
name: CountryRegionCurrency
namespace: source
dataAssetResourceName: datastore://source/CountryRegionCurrency
doc: Mapping of country/region codes to the currency codes used in each, staged from
  the source CountryRegionCurrency table. The contract enforces the declared schema
  and business-key integrity (CountryRegionCode, CurrencyCode); ownership and agreement
  are to be confirmed at the human-in-the-loop checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: CountryRegionCode
  description: Code identifying the country or region that uses the currency. Part
    of the business key.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: CurrencyCode
  description: Code identifying the currency used in the country or region. Part of
    the business key; corresponds to the currency code in the Currency asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the record was last modified in the source.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
