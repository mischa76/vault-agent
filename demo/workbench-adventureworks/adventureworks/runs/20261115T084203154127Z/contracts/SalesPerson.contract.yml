spec-version: 1.0.0
name: SalesPerson
namespace: source
dataAssetResourceName: datastore://source/SalesPerson
doc: Sales representatives (salespeople) staged from the source SalesPerson table,
  with their assigned sales territory, quota, bonus, commission percentage and sales
  totals. The contract enforces the declared schema, business key and not-null rules;
  value-level semantics are not specified by requirements and are left for human review.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
