  description: Identifier of the business entity (employee) that is the salesperson;
    business key of the asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: TerritoryID
