spec-version: 1.0.0
name: SalesOrderDetail
namespace: source
dataAssetResourceName: datastore://source/SalesOrderDetail
doc: 'Line-item detail for a sales order: one row per product line on a SalesOrderHeader,
  including quantity, pricing, discount and computed line total. The contract enforces
  the declared schema and business-key uniqueness/not-null (handled by the deterministic
  core). Ownership and agreement status are to be confirmed at the human-in-the-loop
  checkpoint.'
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: SalesOrderID
  description: Identifier of the parent sales order (references SalesOrderHeader).
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: SalesOrderDetailID
  description: Unique identifier for the individual line item within the sales order.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: CarrierTrackingNumber
