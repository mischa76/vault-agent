spec-version: 1.0.0
name: Customer
namespace: source
dataAssetResourceName: datastore://source/Customer
doc: Customer records from the sales source, staged one row per customer. A customer
  may be an individual (linked via PersonID) or a store (linked via StoreID) and may
  be assigned to a sales territory. The contract enforces the declared schema and
  business key; value-level constraints are not specified by the requirements, so
  none are asserted. Ownership and agreement are to be confirmed at the human-in-the-loop
  checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: CustomerID
  description: Unique identifier of the customer.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PersonID
