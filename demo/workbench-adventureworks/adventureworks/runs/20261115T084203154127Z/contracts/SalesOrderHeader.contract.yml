spec-version: 1.0.0
name: SalesOrderHeader
namespace: source
dataAssetResourceName: datastore://source/SalesOrderHeader
doc: Sales order header records from the source Sales schema, with one row per sales
  order. It holds order-level dates, status, customer, territory, address, shipping,
  payment and currency references, and monetary totals. The contract enforces the
  declared schema and business key. No value-level semantic constraints are asserted,
  because no requirements state any. Ownership and agreement are left to human review.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
