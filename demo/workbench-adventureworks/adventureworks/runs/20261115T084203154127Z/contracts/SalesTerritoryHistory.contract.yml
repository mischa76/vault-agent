spec-version: 1.0.0
name: SalesTerritoryHistory
namespace: source
dataAssetResourceName: datastore://source/SalesTerritoryHistory
doc: Historical record of the sales territories assigned to each salesperson over
  time, with the start and end of each assignment. Staged from the source SalesTerritoryHistory
  table. The contract enforces the declared schema and the business-key identity of
  each record. Ownership and agreement are to be confirmed at the human-in-the-loop
  checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: BusinessEntityID
  description: Identifier of the salesperson (business entity) assigned to the territory.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: TerritoryID
