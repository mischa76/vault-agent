spec-version: 1.0.0
name: StateProvince
namespace: source
dataAssetResourceName: datastore://source/StateProvince
doc: State or province reference records from the source Person schema, staged one
  row per StateProvinceID. Each record links a state/province to its country/region
  and sales territory. The contract enforces the declared schema, business key and
  not-null rules; no value-level thresholds are mandated by the requirements.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: StateProvinceID
  description: Unique identifier for the state or province record (source business
    key).
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: StateProvinceCode
  description: Code identifying the state or province, typically a short ISO-style
    abbreviation.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: CountryRegionCode
  description: Code of the country or region the state/province belongs to; references
    CountryRegion.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: IsOnlyStateProvinceFlag
  description: Flag indicating whether the state/province code is the only one for
    the country/region (true) or whether multiple exist (false).
  examples: []
  constraints:
    primaryKey: false
    data_type: boolean
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Name
  description: Name of the state or province.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: TerritoryID
  description: Identifier of the sales territory the state/province belongs to.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: rowguid
  description: Row-unique GUID assigned by the source system.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
