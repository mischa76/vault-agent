spec-version: 1.0.0
name: Address
namespace: source
dataAssetResourceName: datastore://source/Address
doc: 'Source-to-staging contract for Address: street address records (line 1/2, city,
  state/province, postal code, spatial location) from the source Address table. The
  contract enforces the declared schema and business key; value-level semantics are
  minimal because no requirements specify thresholds. Ownership and agreement are
  to be settled at the human-in-the-loop checkpoint.'
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: AddressID
  description: Unique identifier of the address record.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: AddressLine1
  description: First line of the street address.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: AddressLine2
  description: Second line of the street address (e.g. apartment or suite); may be
    absent.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: City
  description: Name of the city of the address.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: StateProvinceID
  description: Identifier of the state or province for the address; references the
    StateProvince source table.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PostalCode
  description: Postal code of the address.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: SpatialLocation
  description: Geographic/spatial location data for the address. Exact representation
    is not specified in the requirements.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: rowguid
  description: Globally unique identifier (GUID) for the row, used for replication/row
