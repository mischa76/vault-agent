spec-version: 1.0.0
name: Password
namespace: source
dataAssetResourceName: datastore://source/Password
doc: Source-to-staging asset for the Password table, holding credential material (password
  hash and salt) for a business entity (person). The contract enforces the declared
  schema, business key and not-null rules; value-level semantics are left for producer/consumer
  negotiation. Contains sensitive data and should be reviewed for access and handling
  at the human-in-the-loop checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: BusinessEntityID
  description: Identifier of the business entity (person) the password credentials
    belong to; business key for the asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PasswordHash
  description: Hashed representation of the password for the business entity. Sensitive
    credential material.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PasswordSalt
  description: Salt value used when hashing the password. Sensitive credential material.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: rowguid
  description: Globally unique identifier (GUID) for the row, used for replication/row
    identification.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the record was last modified in the source.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
