spec-version: 1.0.0
name: Document
namespace: source
dataAssetResourceName: datastore://source/Document
doc: Product documentation records (e.g., maintenance manuals, specifications) organized
  in a hierarchy, staged from the source Document table. The contract enforces the
  declared schema, business key and not-null rules; value-level semantics are minimal
  because no further requirements were stated. Ownership and agreement are to be confirmed
  at the human-in-the-loop checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: DocumentNode
  description: Hierarchical node identifier locating the document within the document
    tree.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: DocumentLevel
  description: Depth of the document within the document hierarchy, derived from DocumentNode.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
