spec-version: 1.0.0
name: TransactionHistoryArchive
namespace: source
dataAssetResourceName: datastore://source/TransactionHistoryArchive
doc: Archived product transaction history records (e.g., order-related inventory/cost
  transactions) staged from the source TransactionHistoryArchive table. The contract
  enforces the declared schema, business key and not-null rules; no value-level thresholds
  are stated in the requirements, so none are asserted. Ownership and agreement are
  to be confirmed at the human-in-the-loop checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: TransactionID
  description: Unique identifier of the archived transaction.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ProductID
  description: Identifier of the product involved in the transaction; references the
    Product asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ReferenceOrderID
  description: Identifier of the order (e.g., sales or work order) that the transaction
    references.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ReferenceOrderLineID
  description: Identifier of the line within the referenced order that the transaction
