spec-version: 1.0.0
name: Illustration
namespace: source
dataAssetResourceName: datastore://source/Illustration
doc: Source-to-staging asset for Illustration records, which hold diagrams associated
  with product models. The contract enforces the declared schema, the business key
  (IllustrationID) and not-null rules. Ownership and agreement status are left for
  human-in-the-loop review.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: IllustrationID
  description: Identifier of the illustration. This is the business key of the asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Diagram
  description: Illustrative diagram content for the illustration. The format and encoding
    are not specified in the requirements.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the source record was last modified.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
