spec-version: 1.0.0
name: TransactionHistory
namespace: source
dataAssetResourceName: datastore://source/TransactionHistory
doc: Source-to-staging asset representing individual product transaction records (e.g.,
  orders and inventory movements) from the TransactionHistory source table. The contract
  enforces the declared schema, business-key uniqueness and not-null rules; value-level
  semantics are advisory unless a requirement mandates otherwise. Ownership and agreement
  are to be confirmed at the human-in-the-loop checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: TransactionID
  description: Identifier of the transaction record; business key of the asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ProductID
  description: Identifier of the product involved in the transaction; references the
    Product asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ReferenceOrderID
  description: Identifier of the order (e.g., sales or work order) the transaction
    refers to.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ReferenceOrderLineID
  description: Identifier of the line within the referenced order that the transaction
    relates to.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: TransactionDate
  description: Date and time at which the transaction occurred.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: TransactionType
  description: Code indicating the kind of transaction. Allowed values are not constrained
    by the stated requirements.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Quantity
  description: Quantity of product involved in the transaction.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ActualCost
  description: Actual cost associated with the transaction.
  examples: []
  constraints:
    primaryKey: false
    data_type: number
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the source record was last modified.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
