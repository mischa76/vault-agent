doc: Product photo records from the source ProductPhoto table, holding a thumbnail
  and a large image, each with a file name, for use by products. The contract enforces
  the declared schema, the primary key and not-null rules. Value-level semantics are
  limited because no requirements state further constraints. Ownership is not set
  here and is left to human review.
