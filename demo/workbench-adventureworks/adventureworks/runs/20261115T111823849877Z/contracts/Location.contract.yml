spec-version: 1.0.0
name: Location
namespace: source
dataAssetResourceName: datastore://source/Location
doc: Manufacturing/inventory location (e.g., work centre or warehouse area) from the
  source Location table, staged one row per LocationID. The contract enforces the
  declared schema and business-key uniqueness; ownership and agreement are to be confirmed
  at the human review checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: LocationID
  description: Identifier of the location; business key of the asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Name
  description: Name of the location.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: CostRate
  description: Standard hourly cost rate for the location.
  examples: []
  constraints:
    primaryKey: false
    data_type: number
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Availability
  description: Work capacity (in hours) available at the location.
  examples: []
  constraints:
    primaryKey: false
    data_type: number
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the source record was last modified.
  examples: []
  constraints:
