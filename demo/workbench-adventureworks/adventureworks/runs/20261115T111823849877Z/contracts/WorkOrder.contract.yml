spec-version: 1.0.0
name: WorkOrder
namespace: source
dataAssetResourceName: datastore://source/WorkOrder
doc: Manufacturing work order records from the source WorkOrder table, each representing
  a production order for a product with ordered, stocked and scrapped quantities and
  key schedule dates. The contract enforces the declared schema and business key;
  no value-level thresholds are mandated by the requirements.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: WorkOrderID
  description: Unique identifier of the work order (business key).
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ProductID
  description: Identifier of the product being manufactured; references the Product
    asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: OrderQty
  description: Quantity of the product ordered to be manufactured.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: StockedQty
  description: Quantity of the product actually received into inventory from the work
    order.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ScrappedQty
  description: Quantity of the product scrapped during manufacturing.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: StartDate
  description: Date and time the work order started.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: EndDate
  description: Date and time the work order was completed; may be absent while the
    order is open.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: DueDate
  description: Date and time the work order is due to be completed.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ScrapReasonID
  description: Identifier of the reason for scrapping, if any quantity was scrapped;
    references the ScrapReason asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the source record was last modified.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
