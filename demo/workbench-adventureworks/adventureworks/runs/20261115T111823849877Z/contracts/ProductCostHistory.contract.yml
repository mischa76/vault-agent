spec-version: 1.0.0
name: ProductCostHistory
namespace: source
dataAssetResourceName: datastore://source/ProductCostHistory
doc: Historical record of the standard cost of a product over time. Each row gives
  the standard cost in effect for a product during a period bounded by StartDate and
  EndDate. The contract enforces the declared schema and business keys; value-level
  constraints are not specified by the requirements and are left for human review.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: ProductID
  description: Identifier of the product whose standard cost is recorded. Refers to
    a product in the Product asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: StartDate
  description: Date on which the standard cost became effective for the product.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: EndDate
  description: Date on which the standard cost stopped being effective for the product.
    May be empty for the currently effective cost.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: StandardCost
  description: Standard cost of the product during the period between StartDate and
    EndDate.
  examples: []
  constraints:
    primaryKey: false
    data_type: number
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time when the record was last modified.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
