spec-version: 1.0.0
name: ProductModelProductDescriptionCulture
namespace: source
dataAssetResourceName: datastore://source/ProductModelProductDescriptionCulture
doc: Association between a product model, a product description, and a culture, indicating
  which localized description applies to a product model for a given culture. The
  contract enforces the presence and schema of the composite key fields (ProductModelID,
  ProductDescriptionID, CultureID) and the ModifiedDate audit field. Ownership and
  agreement are to be confirmed at the human-in-the-loop checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: ProductModelID
  description: Identifier of the product model this localized description is associated
    with; references ProductModel.ProductModelID.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ProductDescriptionID
  description: Identifier of the product description associated with the product model;
    references ProductDescription.ProductDescriptionID.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: CultureID
  description: Identifier of the culture (language/locale) of the description; references
    Culture.CultureID.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the record was last modified in the source system.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
