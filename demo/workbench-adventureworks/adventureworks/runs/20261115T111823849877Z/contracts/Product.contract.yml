spec-version: 1.0.0
name: Product
namespace: source
dataAssetResourceName: datastore://source/Product
doc: 'Product master data staged from the source Product table: one record per product,
  identified by ProductID. Covers identity, manufacturing and sales attributes, cost
  and price, classification references, and sell-lifecycle dates. The contract enforces
  the declared schema and business key. No value-level constraints are applied because
  no requirements specify any. Ownership and agreement are left to human review.'
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
