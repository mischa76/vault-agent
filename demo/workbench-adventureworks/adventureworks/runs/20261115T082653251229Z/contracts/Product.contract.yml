spec-version: 1.0.0
name: Product
namespace: source
dataAssetResourceName: datastore://source/Product
doc: 'Product master data: one record per product that is manufactured, purchased
  or sold, identified by ProductID. The contract enforces the declared field set and
  types, and the primary key and not-null rules that the deterministic core derives
  from the business keys. No value-level constraints are enforced yet, because the
  requirements state none. Ownership and agreement are left to the human-in-the-loop
  review.'
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: ProductID
  description: Unique identifier of the product (business key).
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
