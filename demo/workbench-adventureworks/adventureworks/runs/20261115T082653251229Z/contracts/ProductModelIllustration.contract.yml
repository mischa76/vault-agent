spec-version: 1.0.0
name: ProductModelIllustration
namespace: source
dataAssetResourceName: datastore://source/ProductModelIllustration
doc: Cross-reference (link) asset associating product models with illustrations, sourced
  from the ProductModelIllustration source table. The contract enforces the presence
  and schema of the composite key (ProductModelID, IllustrationID) and the load/modification
  timestamp. Ownership and agreement status are to be confirmed at the human-in-the-loop
  checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: ProductModelID
  description: Identifier of the product model in the association; references the
    ProductModel asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: IllustrationID
  description: Identifier of the illustration in the association; references the Illustration
    asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the association record was last modified in the source.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
