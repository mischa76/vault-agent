spec-version: 1.0.0
name: ProductDocument
namespace: source
dataAssetResourceName: datastore://source/ProductDocument
doc: Link table associating products with documents (e.g., manuals or specifications)
  in the product catalog. Each row relates one Product to one Document. The contract
  enforces the presence and schema of the composite business key (ProductID, DocumentNode);
  no value-level thresholds are stated in the requirements.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: ProductID
  description: Identifier of the product the document is associated with; references
    Product.ProductID.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: DocumentNode
  description: Hierarchical node identifier of the document associated with the product;
    references Document.DocumentNode.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the association row was last modified in the source system.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
