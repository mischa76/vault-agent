spec-version: 1.0.0
name: WorkOrderRouting
namespace: source
dataAssetResourceName: datastore://source/WorkOrderRouting
doc: 'Routing steps for manufacturing work orders: each record describes an operation
  performed at a location for a product within a work order, with scheduled and actual
  dates, resource hours and planned/actual costs. The contract enforces the declared
  schema, business keys and not-null rules; value-level semantics are advisory.'
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
