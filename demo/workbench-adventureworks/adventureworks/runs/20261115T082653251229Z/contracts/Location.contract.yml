spec-version: 1.0.0
name: Location
namespace: source
dataAssetResourceName: datastore://source/Location
doc: 'Source-to-staging asset for Location: a production/inventory location (e.g.
  work center or storage area) with its cost rate and availability. The contract enforces
  the declared schema and business-key identity of LocationID; value-level semantics
  are left for producer/consumer negotiation.'
owner:
  name: John Doe
  email: john.doe@acme.com
