spec-version: 1.0.0
name: BillOfMaterials
namespace: source
dataAssetResourceName: datastore://source/BillOfMaterials
doc: Bill of materials records describing which component products are used in a product
  assembly, including the validity period, unit of measure, BOM level and per-assembly
  quantity. Contract enforces the declared schema and business key; no value-level
  thresholds are asserted beyond what is stated in requirements.
owner:
  name: John Doe
  email: john.doe@acme.com
