# Entity resolution against the existing vault — review & ratify (WP29).
# resolution: <existing construct name> | NEW | same_as_candidate | unresolved
# Then:  vault-agent resume --resolutions <this file>
# Or:    vault-agent resume --resolve "concept=hub_name"
# A merge is applied ONLY after you ratify it — an unratified proposal never
# steers the modeler, because a wrong merge writes foreign keys into live history.
resolutions:
- concept: employee::NationalIDNumber
  resolution: NEW
  category: key_overlap
  evidence:
  - Employee.NationalIDNumber is a national ID (e.g. social security number) with
    no counterpart in the vault; hub_business_entity is keyed on BusinessEntityID,
    not a national ID.
  - Employee is keyed by BusinessEntityID; NationalIDNumber is more likely an attribute/alternate
    key than a separate hub, but no existing construct holds it.
  confidence: 0.5
  ratification_status: accepted
- concept: employee::BusinessEntityID
  resolution: hub_business_entity
  category: exact_key
  evidence:
  - 'Employee.BusinessEntityID comment: ''Foreign key to BusinessEntity.BusinessEntityID'';
    same column name and key as hub_business_entity''s business key BusinessEntityID.'
  - Explicit cross-reference to the BusinessEntity source entity that feeds hub_business_entity.
  confidence: 0.9
  ratification_status: accepted
