spec-version: 1.0.0
name: JobCandidate
namespace: source
dataAssetResourceName: datastore://source/JobCandidate
doc: Staging asset for job candidates from the source HR JobCandidate table. Each
  record is a candidate with an optional link to an employee (BusinessEntityID), a
  resume document, and a last-modified timestamp. The contract enforces schema, primary
  key and not-null rules; no further value-level constraints are stated in the requirements.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: JobCandidateID
  description: Unique identifier of the job candidate record in the source system.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: BusinessEntityID
  description: Identifier of the employee (business entity) associated with the candidate,
    if the candidate was hired. Refers to the Employee entity. Nullability is not
    stated in the requirements and is left to the deterministic core and human review.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Resume
  description: Resume content of the candidate. The format (for example XML or free
    text) is not stated in the requirements and needs human review.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the record was last modified in the source system.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
