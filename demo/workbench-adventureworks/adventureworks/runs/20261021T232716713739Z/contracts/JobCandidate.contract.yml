spec-version: 1.0.0
name: JobCandidate
namespace: source
dataAssetResourceName: datastore://source/JobCandidate
doc: Source-to-staging asset for job candidates (HumanResources.JobCandidate). Each
  record represents a candidate's submitted resume, optionally linked to an employee
  via BusinessEntityID. The contract enforces the declared schema, business keys and
  not-null rules; value-level semantics are alerting-only unless a requirement mandates
  otherwise. Ownership and agreement are to be confirmed at the human-in-the-loop
  checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: JobCandidateID
  description: Identifier of the job candidate record.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: BusinessEntityID
  description: Identifier of the employee the candidate was hired as, referencing
    the Employee business entity. May be absent for candidates who were not hired.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Resume
  description: Candidate's resume content as submitted. Format of the content is not
    specified in the requirements.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the record was last modified in the source.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
