spec-version: 1.0.0
name: EmployeeDepartmentHistory
namespace: source
dataAssetResourceName: datastore://source/EmployeeDepartmentHistory
doc: Source-to-staging asset recording the history of departments and shifts to which
  each employee has been assigned over time, with start and end dates for each assignment.
  The contract enforces the declared schema and business-key integrity; value-level
  constraints are left for producer/consumer negotiation at the human review checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: BusinessEntityID
  description: Identifier of the employee (business entity) the department assignment
    belongs to; references Employee.BusinessEntityID.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: DepartmentID
  description: Identifier of the department the employee was assigned to; references
    Department.DepartmentID.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ShiftID
  description: Identifier of the work shift the employee was assigned to; references
    Shift.ShiftID.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: StartDate
  description: Date the employee started working in the department and shift.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: EndDate
  description: Date the employee stopped working in the department and shift; empty
    when the assignment is current.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the record was last modified in the source system.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
