# Entity resolution against the existing vault — review & ratify (WP29).
# resolution: <existing construct name> | NEW | same_as_candidate | unresolved
# Then:  vault-agent resume --resolutions <this file>
# Or:    vault-agent resume --resolve "concept=hub_name"
# A merge is applied ONLY after you ratify it — an unratified proposal never
# steers the modeler, because a wrong merge writes foreign keys into live history.
resolutions:
- concept: employee::NationalIDNumber
  resolution: unresolved
  category: key_overlap
  evidence:
  - Employee table carries NationalIDNumber (unique, nvarchar(15)) alongside BusinessEntityID,
    which is an FK to BusinessEntity — so it identifies the same real-world person
    under a different key.
  - Key format differs from BusinessEntityID (int) and no mapping table is given;
    it is an alternate identifier, so it cannot be merged into the hub. Flag for human
    review (may be just an attribute).
  - human ratification
  confidence: 0.45
  ratification_status: overridden
