spec-version: 1.0.0
name: Address
namespace: source
dataAssetResourceName: datastore://source/Address
doc: 'Source-to-staging contract for Address: a physical street address (e.g. for
  customers, vendors, employees) with city, state/province reference, postal code
  and spatial location. Enforces the declared schema and primary key; value-level
  semantics are advisory pending producer/consumer review.'
