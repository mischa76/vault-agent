spec-version: 1.0.0
name: BusinessEntityAddress
namespace: source
dataAssetResourceName: datastore://source/BusinessEntityAddress
doc: Staging asset linking a business entity to an address and the type of that address
  (e.g., billing, shipping). The contract enforces the declared schema and business-key
  integrity; no value-level thresholds are stated in the requirements.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: BusinessEntityID
  description: Identifier of the business entity (person, vendor, store) that the
    address is associated with; references BusinessEntity.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: AddressID
  description: Identifier of the address linked to the business entity; references
    Address.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: AddressTypeID
  description: Identifier of the type of address (e.g., billing, home, shipping);
    references AddressType.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: rowguid
  description: Globally unique identifier (GUID) for the row, used by the source system
    for row identification.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time when the source record was last modified.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
