spec-version: 1.0.0
name: Person
namespace: source
dataAssetResourceName: datastore://source/Person
doc: 'Staging contract for the Person source table: one record per person (individual)
  tracked by a business entity, including name parts, person type, and contact preferences.
  The contract enforces the declared schema, business key (BusinessEntityID) uniqueness
  and not-null. Ownership and agreement are to be finalized at the human-in-the-loop
  checkpoint.'
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: BusinessEntityID
  description: Identifier of the business entity this person record belongs to; business
    key of the Person record.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PersonType
  description: Code classifying the type of person (e.g. employee, customer, contact).
    Allowed value set not specified in requirements.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: NameStyle
  description: Flag indicating how the name is written/ordered (e.g. Western vs. Eastern
    style).
  examples: []
  constraints:
    primaryKey: false
    data_type: boolean
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Title
  description: Courtesy title of the person (e.g. Mr., Ms.). Optional.
