spec-version: 1.0.0
name: PhoneNumberType
namespace: source
dataAssetResourceName: datastore://source/PhoneNumberType
doc: Reference data describing the types of phone numbers (e.g. cell, home, work)
  that can be associated with a person's phone record. Sourced from the PhoneNumberType
  source table into staging. The contract enforces the declared schema and business-key
  uniqueness/not-null; ownership and agreement are to be confirmed at the human review
  checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: PhoneNumberTypeID
  description: Unique identifier of the phone number type; referenced by PersonPhone.PhoneNumberTypeID.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Name
  description: Name of the phone number type (e.g. the kind of phone such as cell,
    home or work).
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the record was last modified in the source system.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
