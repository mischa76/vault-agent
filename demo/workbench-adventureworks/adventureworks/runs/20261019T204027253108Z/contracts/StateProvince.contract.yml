spec-version: 1.0.0
name: StateProvince
namespace: source
dataAssetResourceName: datastore://source/StateProvince
doc: State or province reference records from the source system, each identified by
  StateProvinceID and linked to a country/region and sales territory. The contract
  enforces the declared schema, primary key and not-null rules; no value-level thresholds
  are stated in the requirements.
owner:
  name: John Doe
  email: john.doe@acme.com
