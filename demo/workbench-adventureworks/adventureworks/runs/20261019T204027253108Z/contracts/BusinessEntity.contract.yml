spec-version: 1.0.0
name: BusinessEntity
namespace: source
dataAssetResourceName: datastore://source/BusinessEntity
doc: Source-to-staging asset for BusinessEntity, a base record that identifies a business
  entity (e.g. a person, vendor or store) via a unique BusinessEntityID. The contract
  enforces the declared schema and the business key; no value-level requirements have
  been stated, so no semantic constraints are defined. Ownership and agreement are
  to be confirmed at the human-in-the-loop checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
