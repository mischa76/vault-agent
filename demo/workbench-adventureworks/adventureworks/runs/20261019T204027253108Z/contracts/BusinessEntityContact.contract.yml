spec-version: 1.0.0
name: BusinessEntityContact
namespace: source
dataAssetResourceName: datastore://source/BusinessEntityContact
doc: Staging asset for the source table BusinessEntityContact, which links a business
  entity to a person acting as a contact, qualified by a contact type. The contract
  enforces the declared schema, business-key uniqueness and not-null rules (handled
  by the deterministic core). Ownership and agreement are to be confirmed at the human-in-the-loop
  checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
