spec-version: 1.0.0
name: Password
namespace: source
dataAssetResourceName: datastore://source/Password
doc: Source-to-staging asset for the Password table, holding one credential record
  per business entity (person), including the password hash, its salt, a row GUID,
  and last-modified timestamp. The contract enforces the declared schema, primary
  key and not-null rules; sensitive credential fields should be reviewed by a human
  for handling and access restrictions. Ownership is not set here and is to be agreed
  at the human-in-the-loop checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: BusinessEntityID
  description: Identifier of the business entity (person) that the password record
    belongs to; references the BusinessEntity/Person record.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PasswordHash
  description: Hashed representation of the password for the business entity. Sensitive
    credential data; the hashing algorithm and format are not specified in the requirements.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PasswordSalt
  description: Salt value used when computing the password hash. Sensitive credential
    data; format is not specified in the requirements.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: rowguid
  description: Globally unique identifier (GUID) for the row, used for row identification
    such as replication.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time when the record was last modified.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
