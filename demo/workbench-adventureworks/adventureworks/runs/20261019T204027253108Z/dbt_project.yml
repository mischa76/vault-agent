# Generated by vault-agent — dbt project scaffolding for the generated Data Vault.
# Define a matching connection profile named 'vault_project' in profiles.yml
# (see README.md); then: dbt deps && dbt build.
name: 'vault_project'
version: '1.0.0'
config-version: 2

profile: 'vault_project'

model-paths: ["models"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  vault_project:
    staging:
      # Thin view layer (hash keys / hashdiffs); no need to persist it.
      +materialized: view
    raw_vault:
      # The generated models already carry config(materialized='incremental');
      # this is a belt-and-braces default.
      +materialized: incremental

seeds:
  vault_project:
    # Keep seed column headers UNQUOTED so UPPER_SNAKE identifiers fold consistently
    # with the (also unquoted) identifiers AutomateDV emits (verified on Postgres —
    # see demo/bank_postgres in the vault-agent repo).
    +quote_columns: false
    # Column types pinned from the drafted data contracts (never inferred);
    # columns with an undetermined contract type are omitted and left to dbt's
    # seed inference, so a gap stays visible instead of being guessed at.
    BusinessEntity:
      +column_types:
        BUSINESSENTITYID: bigint
        ROWGUID: varchar
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
    Person:
      +column_types:
        BUSINESSENTITYID: bigint
        PERSONTYPE: varchar
        NAMESTYLE: boolean
        TITLE: varchar
        FIRSTNAME: varchar
        MIDDLENAME: varchar
        LASTNAME: varchar
        SUFFIX: varchar
        EMAILPROMOTION: bigint
        ADDITIONALCONTACTINFO: varchar
        DEMOGRAPHICS: varchar
        ROWGUID: varchar
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
    EmailAddress:
      +column_types:
        BUSINESSENTITYID: bigint
        EMAILADDRESSID: bigint
        EMAILADDRESS: varchar
        ROWGUID: varchar
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
    Password:
      +column_types:
        BUSINESSENTITYID: bigint
        PASSWORDHASH: varchar
        PASSWORDSALT: varchar
        ROWGUID: varchar
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
    Address:
      +column_types:
        ADDRESSID: bigint
        ADDRESSLINE1: varchar
        ADDRESSLINE2: varchar
        CITY: varchar
        STATEPROVINCEID: bigint
        POSTALCODE: varchar
        SPATIALLOCATION: varchar
        ROWGUID: varchar
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
    AddressType:
      +column_types:
        ADDRESSTYPEID: bigint
        NAME: varchar
        ROWGUID: varchar
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
    ContactType:
      +column_types:
        CONTACTTYPEID: bigint
        NAME: varchar
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
    PhoneNumberType:
      +column_types:
        PHONENUMBERTYPEID: bigint
        NAME: varchar
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
    CountryRegion:
      +column_types:
        COUNTRYREGIONCODE: varchar
        NAME: varchar
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
    StateProvince:
      +column_types:
        STATEPROVINCEID: bigint
        STATEPROVINCECODE: varchar
        COUNTRYREGIONCODE: varchar
        ISONLYSTATEPROVINCEFLAG: boolean
        NAME: varchar
        TERRITORYID: bigint
        ROWGUID: varchar
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
    BusinessEntityAddress:
      +column_types:
        BUSINESSENTITYID: bigint
        ADDRESSID: bigint
        ADDRESSTYPEID: bigint
        ROWGUID: varchar
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
    BusinessEntityContact:
      +column_types:
        BUSINESSENTITYID: bigint
        PERSONID: bigint
        CONTACTTYPEID: bigint
        ROWGUID: varchar
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
    PersonPhone:
      +column_types:
        BUSINESSENTITYID: bigint
        PHONENUMBER: varchar
        PHONENUMBERTYPEID: bigint
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
