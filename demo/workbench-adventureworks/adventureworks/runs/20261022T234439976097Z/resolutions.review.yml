# Entity resolution against the existing vault — review & ratify (WP29).
# resolution: <existing construct name> | NEW | same_as_candidate | unresolved
# Then:  vault-agent resume --resolutions <this file>
# Or:    vault-agent resume --resolve "concept=hub_name"
# A merge is applied ONLY after you ratify it — an unratified proposal never
# steers the modeler, because a wrong merge writes foreign keys into live history.
resolutions:
- concept: customer::AccountNumber
  resolution: NEW
  category: key_overlap
  evidence:
  - Customer.AccountNumber is 'number identifying the customer assigned by the accounting
    system', an alternate identifier of the customer concept.
  - No existing hub has a customer account number key. hub_business_entity is keyed
    by BusinessEntityID, which is a different identifier.
  confidence: 0.6
  ratification_status: accepted
- concept: customer::CustomerID
  resolution: NEW
  category: key_overlap
  evidence:
  - Customer.CustomerID is the primary key of its own table. No existing hub is keyed
    by CustomerID.
  - Customer.PersonID and Customer.StoreID reference BusinessEntityID. That makes
    customer a separate account concept pointing at a business entity, not the same
    key.
  - No mapping table says CustomerID equals BusinessEntityID.
  confidence: 0.7
  ratification_status: accepted
- concept: store::BusinessEntityID
  resolution: hub_business_entity
  category: exact_key
  evidence:
  - Store.BusinessEntityID is a BusinessEntityID, the same identifier name and format
    as hub_business_entity's key. The hub is already fed by Person, Employee and Vendor
    from the shared BusinessEntityID space.
  - The column comment says 'Foreign key to Customer.BusinessEntityID', but Customer
    has no such column. The comment looks mistaken, which lowers confidence.
  - The merge rests on the key match only. A reviewer should confirm that Store keys
    come from the BusinessEntity population.
  confidence: 0.7
  ratification_status: accepted
