spec-version: 1.0.0
name: Store
namespace: source
dataAssetResourceName: datastore://source/Store
doc: 'Source-to-staging asset for Store: customer stores (resellers) tracked in the
  sales domain, each identified by a business entity and optionally assigned to a
  salesperson. The contract enforces the declared schema, business-key uniqueness
  and not-null rules; value-level semantics are minimal pending producer/consumer
  review.'
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: BusinessEntityID
  description: Identifier of the business entity that represents the store; business
    key for the Store asset.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Name
  description: Name of the store.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: SalesPersonID
  description: Identifier of the salesperson assigned to the store; references a salesperson
    business entity.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Demographics
  description: Demographic/survey information about the store. Format not specified
    in the requirements; flagged for human review.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: rowguid
  description: Row-level globally unique identifier for the source record.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the source record was last modified.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
