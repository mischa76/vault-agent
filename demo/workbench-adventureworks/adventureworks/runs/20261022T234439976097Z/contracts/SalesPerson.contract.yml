spec-version: 1.0.0
name: SalesPerson
namespace: source
dataAssetResourceName: datastore://source/SalesPerson
doc: Sales representatives (salespeople) staged from the source SalesPerson table,
  with their sales territory assignment, quota, bonus, commission percentage and year-to-date
  / prior-year sales figures. The contract enforces the declared schema, business
  key and not-null rules; no value-level thresholds are mandated by the requirements.
  Ownership and agreement are to be confirmed at the human-in-the-loop checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: BusinessEntityID
  description: Identifier of the salesperson's business entity; business key for the
    salesperson record.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
