spec-version: 1.0.0
name: CurrencyRate
namespace: source
dataAssetResourceName: datastore://source/CurrencyRate
doc: Currency exchange rates between a source and target currency for a given date,
  sourced from the Sales.CurrencyRate table. The contract enforces the declared schema,
  business-key uniqueness, and not-null on keys; value-level semantics are advisory
  pending producer/consumer review.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: CurrencyRateID
  description: Unique identifier for the currency rate record (source surrogate key).
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: CurrencyRateDate
  description: Date and time the exchange rate was obtained.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: FromCurrencyCode
  description: Source (from) currency code for the exchange rate; refers to Currency.CurrencyCode.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ToCurrencyCode
  description: Target (to) currency code for the exchange rate; refers to Currency.CurrencyCode.
  examples: []
