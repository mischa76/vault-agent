spec-version: 1.0.0
name: SalesOrderHeader
namespace: source
dataAssetResourceName: datastore://source/SalesOrderHeader
doc: 'Sales order header records: one row per customer sales order, with order dates,
  status, customer/sales person/territory references, billing and shipping references,
  payment references, and monetary totals. Staged from the source SalesOrderHeader
  table. The contract enforces the declared schema, business key and not-null rules.
  Value-level semantics are not yet specified and need producer/consumer review.'
