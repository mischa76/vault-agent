spec-version: 1.0.0
name: SalesOrderDetail
namespace: source
dataAssetResourceName: datastore://source/SalesOrderDetail
doc: 'Line-item level detail of a sales order, one row per product line within a sales
  order (source: SalesOrderDetail). The contract enforces the declared schema, business-key
  uniqueness and not-null on keys; value-level semantics are soft (alerting) pending
  producer/consumer review.'
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: SalesOrderID
  description: Identifier of the parent sales order (references SalesOrderHeader).
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: SalesOrderDetailID
  description: Identifier of the line item within the sales order detail table.
