spec-version: 1.0.0
name: CreditCard
namespace: source
dataAssetResourceName: datastore://source/CreditCard
doc: Source-to-staging asset for credit card records from the Sales schema. Each record
  describes a payment card (type, number, expiration month and year) and when it was
  last modified. The contract enforces the declared schema, primary key and not-null
  constraints; value-level semantics are alerting only because no requirements mandate
  blocking checks. Ownership and agreement status are to be confirmed at the human-in-the-loop
  checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: CreditCardID
  description: Unique identifier of the credit card record in the source system.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: CardType
  description: Type or brand of the credit card. The allowed value set is not stated
    in the requirements.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: CardNumber
  description: Credit card number as held in the source. This is sensitive payment
    data, so consumers should review its handling and masking.
  examples: []
  constraints:
    primaryKey: true
    data_type: string
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ExpMonth
  description: Expiration month of the credit card.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ExpYear
  description: Expiration year of the credit card.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the record was last modified in the source system.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
