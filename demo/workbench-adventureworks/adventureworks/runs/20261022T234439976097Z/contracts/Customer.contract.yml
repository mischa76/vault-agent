spec-version: 1.0.0
name: Customer
namespace: source
dataAssetResourceName: datastore://source/Customer
doc: Customer records from the Sales source, staged for the data vault. Each row represents
  a customer, who may be an individual (PersonID) or a store (StoreID), optionally
  assigned to a sales territory. The contract enforces the declared schema, business
  key and not-null rules. Ownership and agreement are to be confirmed at the human-in-the-loop
  checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: CustomerID
  description: Unique identifier of the customer.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PersonID
  description: Identifier of the individual person associated with the customer. It
    references a person record. It may be absent for store customers.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: StoreID
  description: Identifier of the store associated with the customer. It references
    a store record. It may be absent for individual customers.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: TerritoryID
  description: Identifier of the sales territory the customer belongs to.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: AccountNumber
  description: Customer account number used as a business-facing reference.
  examples: []
  constraints:
    primaryKey: true
    data_type: unknown
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: rowguid
  description: Globally unique row identifier (GUID) assigned in the source system.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: ModifiedDate
  description: Date and time the source record was last modified.
  examples: []
  constraints:
    primaryKey: false
    data_type: string
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
