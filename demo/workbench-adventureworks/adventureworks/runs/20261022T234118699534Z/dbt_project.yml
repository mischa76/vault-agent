# Generated by vault-agent — dbt project scaffolding for the generated Data Vault.
# Define a matching connection profile named 'vault_project' in profiles.yml
# (see README.md); then: dbt deps && dbt build.
name: 'vault_project'
version: '1.0.0'
config-version: 2

profile: 'vault_project'

model-paths: ["models"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  vault_project:
    staging:
      # Thin view layer (hash keys / hashdiffs); no need to persist it.
      +materialized: view
    raw_vault:
      # The generated models already carry config(materialized='incremental');
      # this is a belt-and-braces default.
      +materialized: incremental

seeds:
  vault_project:
    # Keep seed column headers UNQUOTED so UPPER_SNAKE identifiers fold consistently
    # with the (also unquoted) identifiers AutomateDV emits (verified on Postgres —
    # see demo/bank_postgres in the vault-agent repo).
    +quote_columns: false
    # Column types pinned from the drafted data contracts (never inferred);
    # columns with an undetermined contract type are omitted and left to dbt's
    # seed inference, so a gap stays visible instead of being guessed at.
    Vendor:
      +column_types:
        BUSINESSENTITYID: bigint
        ACCOUNTNUMBER: varchar
        NAME: varchar
        CREDITRATING: bigint
        PREFERREDVENDORSTATUS: boolean
        ACTIVEFLAG: boolean
        PURCHASINGWEBSERVICEURL: varchar
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
    PurchaseOrderHeader:
      +column_types:
        PURCHASEORDERID: bigint
        REVISIONNUMBER: bigint
        STATUS: bigint
        EMPLOYEEID: bigint
        VENDORID: bigint
        SHIPMETHODID: bigint
        ORDERDATE: varchar
        SHIPDATE: varchar
        SUBTOTAL: numeric
        TAXAMT: numeric
        FREIGHT: numeric
        TOTALDUE: numeric
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
    PurchaseOrderDetail:
      +column_types:
        PURCHASEORDERID: bigint
        PURCHASEORDERDETAILID: bigint
        DUEDATE: varchar
        ORDERQTY: bigint
        PRODUCTID: bigint
        UNITPRICE: numeric
        LINETOTAL: numeric
        RECEIVEDQTY: numeric
        REJECTEDQTY: numeric
        STOCKEDQTY: numeric
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
    ShipMethod:
      +column_types:
        SHIPMETHODID: bigint
        NAME: varchar
        SHIPBASE: numeric
        SHIPRATE: numeric
        ROWGUID: varchar
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
    ProductVendor:
      +column_types:
        PRODUCTID: bigint
        BUSINESSENTITYID: bigint
        AVERAGELEADTIME: bigint
        STANDARDPRICE: numeric
        LASTRECEIPTCOST: numeric
        LASTRECEIPTDATE: varchar
        MINORDERQTY: bigint
        MAXORDERQTY: bigint
        ONORDERQTY: bigint
        UNITMEASURECODE: varchar
        MODIFIEDDATE: varchar
        LOAD_DATETIME: timestamp
        RECORD_SOURCE: varchar
