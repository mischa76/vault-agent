spec-version: 1.0.0
name: PurchaseOrderHeader
namespace: source
dataAssetResourceName: datastore://source/PurchaseOrderHeader
doc: Purchase order header records from the source system, one row per purchase order,
  covering the ordering employee, vendor, ship method, order and ship dates, and monetary
  totals. The contract enforces the declared schema, business key (PurchaseOrderID)
  and not-null rules; value-level semantics are advisory pending producer/consumer
  review.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: PurchaseOrderID
  description: Unique identifier of the purchase order (business key).
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: RevisionNumber
  description: Revision number of the purchase order, incremented when the order is
    changed.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: Status
  description: Current status code of the purchase order. The allowed value set is
    not specified in the requirements.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: EmployeeID
  description: Identifier of the employee who created the purchase order.
  examples: []
  constraints:
    primaryKey: true
    data_type: integer
    enum: []
    is_nullable: false
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: VendorID
  description: Identifier of the vendor the order is placed with (corresponds to Vendor.BusinessEntityID).
