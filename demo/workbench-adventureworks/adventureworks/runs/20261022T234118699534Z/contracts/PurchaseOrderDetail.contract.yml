spec-version: 1.0.0
name: PurchaseOrderDetail
namespace: source
dataAssetResourceName: datastore://source/PurchaseOrderDetail
doc: Line-item detail of a purchase order, one row per product ordered on a purchase
  order, sourced from the PurchaseOrderDetail source table and staged for the vault.
  The contract enforces the declared schema and business-key integrity (PurchaseOrderID,
  PurchaseOrderDetailID). Ownership and agreement are to be confirmed at the human
  review checkpoint.
owner:
  name: John Doe
  email: john.doe@acme.com
schema:
- name: PurchaseOrderID
  description: Identifier of the purchase order (header) this line item belongs to.
  examples: []
  constraints:
    primaryKey: false
    data_type: integer
    enum: []
    is_nullable: true
    is_updatable: true
    precision: null
  semantics: []
  failure_mode: hard
- name: PurchaseOrderDetailID
  description: Identifier of the individual line item within the purchase order detail.
  examples: []
  constraints:
