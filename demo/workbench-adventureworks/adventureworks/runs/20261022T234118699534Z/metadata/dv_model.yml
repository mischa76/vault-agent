    hub rather than getting a hub of their own. Email, phone and credential relations
    are also keyed by BusinessEntityID and feed this hub.
  name: hub_business_entity
  requirement_ids:
  - REQ-001
  - REQ-002
  - REQ-003
  - REQ-004
  - REQ-007
  - REQ-008
  - REQ-045
  - REQ-047
  - REQ-049
  - REQ-077
